name: Build and publish docker image.
run-name: ${{ github.actor }} building docker image on ${{ github.ref }} triggered by ${{ github.event_name }} event

on:
  push:
    paths:
    - src/**
    - pom.xml
    - Dockerfile
    - .m2-settings.xml
    - .github/workflows/docker.yml
  pull_request:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

    - name: Extract repository name
      run: echo "REPO_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> $GITHUB_ENV

    - name: Checkout repository
      uses: actions/checkout@v4

    # Set up BuildKit Docker container builder to be able to build
    # multi-platform images and export cache
    # https://github.com/docker/setup-buildx-action
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Log in to GitHub registry except for pull requests
    - name: Log into registry ${{ env.REGISTRY }}
      uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # Extract and set metadata for Docker
    # https://github.com/docker/metadata-action
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=schedule
          type=ref, event=branch
          type=ref, event=tag
          type=ref, event=pr
          # set latest tag for default branch
          type=raw,value=latest,enable={{is_default_branch}}

    # Build and push Docker image. Don't push for pull requests
    # https://github.com/docker/build-push-action
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        provenance: false
        # Build but don't push image on pull request event
        push: ${{ github.event_name != 'pull_request' }}
        # Tags generated by metadata-action
        tags: ${{ steps.meta.outputs.tags }}
        # Labels generated by metadata-action
        labels: ${{ steps.meta.outputs.labels }}
        # Caching strategy
        cache-from: type=gha
        cache-to: type=gha, mode=max

    # Remove all untagged images
    # https://github.com/actions/delete-package-versions/
    - name: Remove untagged images from registry
      if: github.event_name != 'pull_request'
      uses: actions/delete-package-versions@v5
      with:
        package-name: ${{ env.REPO_NAME }}
        package-type: 'container'
        min-versions-to-keep: 0
        delete-only-untagged-versions: true
