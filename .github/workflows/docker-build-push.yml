name: Build and push Docker image to GitHub registry
run-name: "[docker-build-push] ${{ github.actor }} from ${{ github.ref }} triggered by ${{ github.event_name }} event"

on:
  workflow_call:
    inputs:
      registry:
        description: "registry domain name"
        required: true
        type: string
      image_name:
        description: "image name"
        required: true
        type: string
      branch_name:
        description: "branch name for image tagging"
        required: true
        type: string

jobs:

  build-push-docker-image:
    name: build-push-docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into registry ${{ inputs.registry }}
      uses: docker/login-action@v3
      if: github.event_name != 'pull_request'
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Sanitize branch name manually to create tag name
      env:
        RAW_BRANCH_NAME: ${{ inputs.branch_name }}
      run: echo "TAG_NAME=$(echo $RAW_BRANCH_NAME | sed 's/[^[:alnum:]\.\_\-]/-/g')" >> $GITHUB_ENV

    - name: Generate labels automatically from GitHub context
      id: meta
      uses: docker/metadata-action@v5

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        provenance: false
        push: true
        tags: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ env.TAG_NAME }}
        labels: ${{ steps.meta.outputs.labels }}
        # Caching strategy
        cache-from: type=gha
        cache-to: type=gha, mode=max

  cleanup-registry:
    needs: build-push-docker-image
    uses: ./.github/workflows/docker-registry-cleanup.yml
