heightmaps:
  ground:
    default: 0
sources:
  mnt:
    modelType: mnt
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix
  bati:
    modelType: building
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    processor:
      type: geoToolsVector
    postProcessors:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: default
        metadata: height
        value: 5
        as: integer
  veget:
    modelType: vegetation
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:zone_de_vegetation
    processor:
      type: geoToolsVector
renderers:
  altitude:
    after:
      - source:mnt
    type: heightmap
    models:
      type: mnt
    heightmap: ground
  ground:
    after:
      - renderer:altitude
    type: ground
    heightmap: ground
    place:
      structure:
        - put: default:dirt_with_grass
          at: [0, 0, 0]
        - put: default:dirt
          at: [0, 0, -3..-1]
        - put: default:stone
          at: [0, 0, -20..-4]
  building-leveling:
    after:
      - source:bati
      - renderer:ground
    type: leveling
    models:
      type: building
    heightmap: ground
    filling: default:cobble
  building:
    after:
      - renderer:building-leveling
    type: building
    models:
      type: building
      filter:
        not:
          or:
            - metadata: height
              lowerThan: 0
            - metadata: height
              equals: 0
    heightmap: ground
    roof: default:cobble
    wall: default:stone
    window: default:glass
  forest:
    after:
      - renderer:ground
      - source:veget
    type: vector
    models:
      type: vegetation
      filter:
        metadata: nature
        in:
          - "Bois"
          - "Forêt fermée de conifères"
          - "Forêt fermée de feuillus"
          - "Forêt fermée mixte"
          - "Forêt ouverte"
          - "Zone arborée"
    heightmap: ground
    inside:
      - pattern:
          chance: 0.1
          place:
            structure:
              - at: [0, 0, 1]
                put: default:junglegrass
      - default:dirt_with_rainforest_litter
      - pattern:
          chance: 0.05
          place:
            structure:
              - at: [-2..2, -2..2, 4..8]
                put:
                  pattern:
                    place: default:leaves
                    chance: 0.9
              - at: [0, 0, 0..4]
                put: default:tree
    edge: nothing
verticalScale: 1.0
horizontalScale: 1.0
area:
  center:
    latitude: 48.845
    longitude: 2.425
  angle: 0
  extentX: 1000
  extentY: 1000
crs: EPSG:2154
format: minetest
