heightmaps:
  ground:
    default: 0
sources:
  mnt:
    modelType: mnt
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix
  bati:
    modelType: building
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    processor:
      type: geoToolsVector
    postProcessors:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: default
        metadata: height
        value: 5
        as: integer
  road:
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route
    processor:
      type: geoToolsVector
  railroad:
    modelType: railroad
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_voie_ferree
    processor:
      type: geoToolsVector
renderers:
  altitude:
    after:
      - source:mnt
    type: heightmap
    models:
      type: mnt
    heightmap: ground
  ground:
    after:
      - renderer:altitude
    type: ground
    heightmap: ground
    place:
      structure:
        - put: default:dirt_with_grass
          at: [0, 0, 0]
        - put: default:dirt
          at: [0, 0, -3..-1]
        - put: default:stone
          at: [0, 0, -20..-4]
  building-leveling:
    after:
      - source:bati
      - renderer:ground
    type: leveling
    models:
      type: building
    heightmap: ground
    filling: default:cobble
  building:
    after:
      - renderer:building-leveling
    type: building
    models:
      type: building
      filter:
        not:
          or:
            - metadata: height
              lowerThan: 0
            - metadata: height
              equals: 0
    heightmap: ground
    roof: default:cobble
    wall: default:stone
    window: default:glass
  bridge:
    after:
      - source:road
      - renderer:ground
    type: linear
    models:
      type: road
    structure:
      axes: [ z, y ]
      blueprint:
        - "      XX"
        - "XXXXXXXX"
      with:
        "X": default:stone
  roads-pass1:
    after:
      - source:road
      - renderer:bridge
    type: linear
    models:
      type: road
    structure:
      axes: [ y, x ]
      blueprint:
        - "====="
        - ""
        - ""
        - ""
        - ""
        - ""
      with:
        "=": wool:white
        "-": wool:black
      zOffset: 1
  roads-pass2:
    after:
      - renderer:roads-pass1
    type: linear
    models:
      type: road
    structure:
      axes: [ z, y, x ]
      blueprint:
      - - "....."
        - "....."
        - "....."
        - "....."
        - "....."
        - "....."
      - - "....."
        - "....."
        - "....."
        - "....."
        - "....."
        - "....."
      - - ""
        - "-----"
        - "-----"
        - "-----"
        - "-----"
        - "==---"
      with:
        "=": wool:white
        "-": wool:black
        ".": air
      zOffset: 1
verticalScale: 1.0
horizontalScale: 1.0
