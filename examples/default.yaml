heightmaps:
  ground:
    default: 0
sources:
  mnt:
    modelType: mnt
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix
  bati:
    modelType: building
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    processor:
      type: geoToolsVector
    postProcessors:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: integer
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: default
        metadata: height
        value: 5
        as: integer
renderers:
  altitude:
    after:
      - source:mnt
    type: heightmap
    models:
      type: mnt
    heightmap: ground
  ground:
    after:
      - renderer:altitude
    type: ground
    heightmap: ground
    place:
      type: stack
      direction: downwards
      layers:
        - material: default:dirt_with_grass
        - material: default:dirt
          height: 3
        - material: default:stone
          height: 10
  building:
    after:
      - renderer:altitude
      - source:bati
    type: vector
    models:
      type: building
      filter:
        hasMetadata: height
    heightmap: ground
    inside: default:cobble
    edge: default:stone
verticalScale: 1.0
horizontalScale: 1.0
area:
  center:
    latitude: 48.845
    longitude: 2.425
  angle: 0
  extentX: 1000
  extentY: 1000
crs: EPSG:2154
format: minetest
