#          "<": minecraft:nether_brick_fence[south=true]
#          "^": minecraft:nether_brick_fence[east=true]
#          "L": minecraft:redstone_lamp
#          "S":
#            block: minecraft:daylight_detector
#            blockEntity: true
#            properties:
#              inverted: true
#          "*": # This is mainly to demonstrate full block entity support
#            block: minecraft:player_head
#            blockEntity: minecraft:skull
#            dataTags: >-
#              {
#                profile: {
#                  properties: [
#                    {
#                      name: textures,
#                      value: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNzI3YmY4NzY0MzVlMDRkZGU5ZGExOTkyNDMxNWFlNTlhOGVmYzI3YWYxZGRiZWY4MTNkODljZmFmZmU5MTY0NyJ9fX0="
#                    }
#                  ]
#                }
#              }
#        xOffset: -1
#        yOffset: -1
#        zOffset: 11
#      - at: [ 0, 0, 1..10 ]
#        put: minecraft:nether_brick_fence
  - &fire-hydrant
    structure:
      - put: minecraft:red_wool
        at: [ 0, 0, 1..3 ]
      - put: minecraft:red_wool
        at: [ 0, 1, 2 ]
  - &trash-can
    structure:
      - put: minecraft:cauldron
        at: [ 0, 0, 1 ]
  - &pic-nic
    structure:
      axes: [ z, x, y ]
      blueprint:
        - - "     "
          - "OOOOO"
          - "OOOOO"
          - "OOOOO"
          - "     "
        - - "OOOOO"
          - "+   +"
          - "     "
          - "+   +"
          - "OOOOO"
        - - "v   v"
          - "|   |"
          - "=   ="
          - "|   |"
          - "^   ^"
      with:
        "O": minecraft:oak_slab
