    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "13", "31" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buildings-roof-zinc-tiles

  renderBati3dRoofsChapelleEglise:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: nature
        in: [ "Chapelle", "Eglise", "Château" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buildings-roof-church

  renderBati3dRoofsSlatesTile:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "12", "21" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buildings-roof-slates-tiles

  renderBati3dRoofsSlates:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "2", "02", "20", "22" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buildings-roof-slates

  renderBati3dRoofsConcrete:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "4", "04", "40", "44" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buildings-roof-concrete

  fetchWalls:
    type: fetchData
    modelType: wall
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:construction_lineaire
    <<: *wfs-retry-policy
    postProcessing:
      - type: conditional
        if:
          not:
            metadata: nature
            in: [ "Mur", "Mur anti-bruit", "Mur de soutènement" ]
        then:
          type: discard

  renderWalls:
    after:
      - fetchWalls
      - ground
    type: renderLines
    models:
      type: wall
    structure:
      at: [ 0, 0..1, -64..0 ]
      put: *buildings-walls-church
    renderOnlyWhenAbove: ground

  # Roads & paths

  fetchRoads:
    type: fetchData
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route
    <<: *wfs-retry-policy
    postProcessing:
      # Discard fictive features (should be done on all BDTOPO features)
      - type: conditional
        if:
          metadata: fictif
          equals: true
        then:
          type: discard
      # Discard underground roads (only for JDC demo)
      - type: conditional
        if:
          metadata: position_par_rapport_au_sol
          lowerThan: 0
        then:
          type: discard
      # Position metadata
      - type: conditional
        if:
          metadata: position_par_rapport_au_sol
          greaterThan: 0
        then:
          type: default
          metadata: position
          value: aerial
          as: text
        else:
          type: default
          metadata: position
          value: ground
          as: text
      # Width computing
      - type: parse
        metadata: largeur_de_chaussee
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: conditional
        if:
          metadata: largeur_de_chaussee
          greaterThan: 0
        then:
          type: copy
          metadata: largeur_de_chaussee
          to: width
        else:
          type: conditional
          if:
            and:
              - metadata: nature
                in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
              - not:
                  metadata: acces_vehicule_leger
                  equals: Physiquement impossible
          then:
            type: default
            metadata: width
            value: 5
            as: integer
          else:
            type: default
            metadata: width
            value: 3
            as: integer

  cleanRoads:
    after:
      - fetchRoads
      - vegetation
      - ground
      - fields
    type: schedule
    models:
      type: road
    do:
      ground:
        models:
          filter:
            metadata: position
            equals: ground
        type: renderDynamicLines
        width: &roads-width
          round:
            product: [width, 0.7]
        repeated:
          put: *air
          at: [0, 0, 1..7]
        stickToHeightmap: &roads-ground
          convolutionBilateral:
            max: [ ground, groundLidar ]
          kernel: # Gaussian 2D with sigma = 3 (scaled x100)
            - [ 0.299, 0.441, 0.582, 0.688, 0.727, 0.688, 0.582, 0.441, 0.299 ]
            - [ 0.441, 0.651, 0.859, 1.015, 1.073, 1.015, 0.859, 0.651, 0.441 ]
            - [ 0.582, 0.859, 1.134, 1.339, 1.416, 1.339, 1.134, 0.859, 0.582 ]
            - [ 0.688, 1.015, 1.339, 1.582, 1.673, 1.582, 1.339, 1.015, 0.688 ]
            - [ 0.727, 1.073, 1.416, 1.673, 1.768, 1.673, 1.416, 1.073, 0.727 ]
            - [ 0.688, 1.015, 1.339, 1.582, 1.673, 1.582, 1.339, 1.015, 0.688 ]
            - [ 0.582, 0.859, 1.134, 1.339, 1.416, 1.339, 1.134, 0.859, 0.582 ]
            - [ 0.441, 0.651, 0.859, 1.015, 1.073, 1.015, 0.859, 0.651, 0.441 ]
            - [ 0.299, 0.441, 0.582, 0.688, 0.727, 0.688, 0.582, 0.441, 0.299 ]
          range: 2.5
      aerial:
        models:
          filter:
            metadata: position
            equals: aerial
        type: renderDynamicLines
        width: *roads-width
        repeated:
          put: *air
          at: [0, 0, 1..7]

  path:
    type: schedule
    after:
      - fetchRoads
      - renderWater
      - ground
      - fields
    models:
      type: road
    do:
      foot:
        type: renderDynamicLines
        models:
          filter:
            metadata: nature
            in: [ "Chemin", "Sentier", "Route empierrée" ]
        stickToHeightmap: *roads-ground
        width: *roads-width
        repeated:
          put: *path
          at: [0, 0, 0]
      cycle:
        type: renderDynamicLines
        models:
          filter:
            metadata: nature_de_la_restriction
            equals: Piste cyclable
        stickToHeightmap: *roads-ground
        width: *roads-width
        repeated:
          put: *cycle-path
          at: [0, 0, 0]
      stairs:
        type: renderDynamicLines
        models:
          filter:
            metadata: nature
            equals: "Escalier"
        stickToHeightmap: *roads-ground
        width: *roads-width
        repeated:
          put: *stairs
          at: [0, 0, 0]
      other:
        type: renderDynamicLines
        models:
          filter:
            and:
              - not:
                  metadata: nature
                  in: [ "Escalier", "Chemin", "Sentier", "Route empierrée" ]
              - metadata: acces_vehicule_leger
                equals: Physiquement impossible
              - not:
                  metadata: nature_de_la_restriction
                  equals: Piste cyclable
        stickToHeightmap: *roads-ground
        width: *roads-width
        repeated:
          put: *other-path
          at: [0, 0, 0]

  renderGroundRoads:
    after:
      - fetchRoads
      - path
      - ground
    models:
      type: road
      filter:
        and:
          - metadata: position
            equals: ground
          - not:
              metadata: acces_vehicule_leger
              equals: Physiquement impossible
          - metadata: nature
            in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    type: sequence
    do:
      # Sidewalks
      - type: renderDynamicLines
        width: *roads-width
        repeated:
          put: nothing
          at: [ 0, 0, -2..0 ]
        extra:
          - put: *sidewalk
            at: [ 0, 0..1, 0 ]
          - put: *sidewalk-bed
            at: [ 0, 0..1, -2..-1 ]
        stickToHeightmap: *roads-ground
      # Road surface
      - type: renderDynamicLines
        width: *roads-width
        repeated:
          - put: *road-tar
            at: [ 0, 0, 0 ]
          - put: *road-bed
            at: [ 0, 0, -2..-1 ]
        stickToHeightmap: *roads-ground
      # Lines
#      - type: renderLines
#        models:
#          type: road
#          filter:
#            metadata: nombre_de_voies
#            equals: 2
#            as: text
#        structure:
#          axes: [ x ]
#          blueprint: "   ==="
#          with:
#            "=": *road-paint
#        stickToHeightmap: *roads-ground
#      - type: renderLines
#        models:
#          filter:
#            metadata: nombre_de_voies
#            greaterThan: 2
#        structure:
#          axes: [ y, x ]
#          blueprint:
#            - "   ==="
#            - "      "
#            - "      "
#            - "      "
#          with:
#            "=": *road-paint
#        stickToHeightmap: *roads-ground

  renderAerialRoads:
    after:
      - cleanRoads
      - path
      - renderGroundRoads # We update ground so we should go after it
    models:
      type: road
      filter:
        and:
          - metadata: position
            equals: aerial
          - not:
              metadata: acces_vehicule_leger
              equals: Physiquement impossible
          - metadata: nature
            in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    type: sequence
    do:
      # Sidewalks
      - type: renderDynamicLines
        width: *roads-width
        repeated:
          put: nothing
          at: [ 0, 0, -2..0 ]
        extra:
          - put: *sidewalk
            at: [ 0, 0..1, 0 ]
          - put: *sidewalk-bed
            at: [ 0, 0..1, -2..-1 ]
        updateHeightmap: ground
      # Road surface
      - type: renderDynamicLines
        width: *roads-width
        repeated:
          - put: *road-tar
            at: [ 0, 0, 0 ]
          - put: *road-bed
            at: [ 0, 0, -2..-1 ]
        updateHeightmap: ground
      # Lines
#      - type: renderLines
#        models:
#          filter:
#            metadata: nombre_de_voies
#            equals: 2
#            as: text
#        structure:
#          axes: [ x ]
#          blueprint: "   ==="
#          with:
#            "=": *road-paint
#      - type: renderLines
#        models:
#          filter:
#            metadata: nombre_de_voies
#            greaterThan: 2
#        structure:
#          axes: [ y, x ]
#          blueprint:
#            - "   ==="
#            - "      "
#            - "      "
#            - "      "
#          with:
#            "=": *road-paint

  roads:
    type: noOperation
    after:
      - renderAerialRoads
      - renderGroundRoads

  crosswalks:
    # (may behave strangly on stacked roads)
    models:
      type: crosswalks
    type: sequence
    using: roads
    do:
      # Fetch data
      - type: fetchData
        modelType: crosswalks
        provider:
          type: overpass
          url: *overpass-instance
          query: way[footway="crossing"]
        <<: *overpass-retry-policy

      # Wipe road lines
#      - type: renderLines
#        after: roads
#        stickToHeightmap: *roads-ground
#        structure:
#          put:
#            pattern:
#              place: *road-tar
#              onlyInsteadOf: *road-paint
#          at: [ 0..3, 0..5, 0 ]

      # Draw cross walks
      - type: renderLines
        stickToHeightmap: *roads-ground
        structure:
          axes: [ y, x ]
          blueprint:
            - "  =="
            - "  =="
            - "  =="
            - "  =="
          with:
            "=":
              pattern:
                place: *road-paint
                onlyInsteadOf: *road-tar

  # Trees Lidar + OSM

  fetchTrees:
    type: fetchData
    modelType: trees
    provider:
      type: overpass
      url: *overpass-instance
      query: node[natural="tree"]
    <<: *overpass-retry-policy

  fetchLidar:
    type: fetchData
    modelType: lidarhd
    provider:
      type: lasTiled
      tilesPath: data/lidar
      tilesFilenameTemplate: LHD_FXX_%04d_%04d_PTS_LAMB93_IGN69.copc.laz
      tileSize: 1000
      tileOffsetY: 1000
    processor:
      type: lasMerged

  renderVegetation:
    after: fetchLidar
    type: renderVoxels
    models:
      type: lidarhd
      filter:
        metadata: classification
        in: [ 3, 4, 5 ]
        as: integer
    place: *tree-leaves

  findHighestLeaves:
    after:
      - fetchTrees
      - renderVegetation
    type: findVoxels
    models:
      type: trees
    only: *tree-leaves-list
    find:
      average: average-leaves

  renderTrunks:
    after: findHighestLeaves
    type: fillBetweenHeightmapAndValue
    models:
      type: trees
    heightmap: ground
    altitudeValue:
      sum: [ average-leaves, -1 ]
    placeBelow: *tree-trunk

  renderFakeTreeCrown:
    after: renderTrunks
    type: renderSurfaces
    models:
      type: trees
    altitude:
      sum: [ average-leaves, -1 ]
    place:
      structure:
        axes: [ x, z, y ]
        with:
          $: *tree-leaves
        blueprint:
          - [ "       ", "       ", "  $$$  ", "  $$$  ", "  $$$  ", "       ", "       " ]
          - [ "       ", "  $$$  ", " $$$$$ ", " $$$$$ ", " $$$$$ ", "  $$$  ", "       " ]
          - [ "  $$$  ", " $$$$$ ", "$$$$$$$", "$$$$$$$", "$$$$$$$", " $$$$$ ", "  $$$  " ]
          - [ "  $$$  ", " $$$$$ ", "$$$$$$$", "$$$ $$$", "$$$ $$$", " $$ $$ ", "  $ $  " ]
          - [ "  $$$  ", " $$$$$ ", "$$$$$$$", "$$$$$$$", "$$$$$$$", " $$$$$ ", "  $$$  " ]
          - [ "       ", "  $$$  ", " $$$$$ ", " $$$$$ ", " $$$$$ ", "  $$$  ", "       " ]
          - [ "       ", "       ", "  $$$  ", "  $$$  ", "  $$$  ", "       ", "       " ]
        xOffset: -3
        yOffset: -3
        zOffset: -3

  vegetation:
    type: noOperation
    after:
      - renderFakeTreeCrown
      - renderVegetation

  # Metro stations
