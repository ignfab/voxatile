      zOffset: 1

  - &wms-retry-policy
    retry: 3
    retryDelay: 10
  - &wfs-retry-policy
    retry: 3
    retryDelay: 10
  - &overpass-retry-policy
    retry: 5
    retryDelay: 15

heightmaps:
  ground:
    default: 0
  water:
    default: 0
  groundLidar:
    default: 0

forEachTile:

  # Altitude
  # LIDAR and RGE are used here because LIDAR is good on land, but bad on water. RGE is the opposite.

  fetchAltitude:
    type: fetchData
    modelType: altitude
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    <<: *wms-retry-policy

  fetchAltitudeLidar:
    type: fetchData
    modelType: altitudeLidar
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r
      layer: IGNF_LIDAR-HD_MNT_ELEVATION.ELEVATIONGRIDCOVERAGE.LAMB93
    <<: *wms-retry-policy

  setAltitude:
    after: fetchAltitude
    type: populateHeightmap
    models:
      type: altitude
    heightmap: ground

  setAltitudeLidar:
    after: fetchAltitudeLidar
    type: populateHeightmap
    models:
      type: altitudeLidar
    heightmap: groundLidar

#  mergeAltitude:
#    after:
#      - setAltitude
#      - setAltitudeLidar
#      - fetchRoads
#    type: copyHeightmap
#    models:
#      type: road
#      filter:
#        metadata: position
#        equals: ground
#    from: groundLidar
#    to: ground
#    linear: true
#    width:
#      round:
#        product: [ width, 2 ]

  # Convenience task telling altitudes are known
  altitude:
    type: noOperation
    after: #mergeAltitude
      - setAltitude
      - setAltitudeLidar

  # This should be later, after last ground heightmap update
  setSpawn:
    after: altitude
    type: setSpawn
    heightmap:
      sum: [ground, 1]
    x: 0
    y: 0

  # Ground

  renderGround:
    after:
      - setAltitude
      - flattenWater
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *underground
          at: [0, 0, -20..-4]
        - put: *dirt
          at: [0, 0, -3..-1]
        - put: *grass
          at: [0, 0, 0]

  fetchZoneActivite:
    type: fetchData
    modelType: zoneActivite
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:zone_d_activite_ou_d_interet
    <<: *wfs-retry-policy

  renderPlace:
    after:
      - fetchZoneActivite
      - renderGround
    type: renderSurfaces
    models:
      type: zoneActivite
      filter:
        metadata: nature_detaillee
        equals: Place
    heightmap: ground
    place: *plazza

  renderSquareGround:
    after:
      - fetchZoneActivite
      - renderGround
    type: renderSurfaces
    models:
      type: zoneActivite
      filter:
        metadata: nature_detaillee
        # TODO: Maybe a case insensitive equals / in ?
        equals: Square
    heightmap: ground
    place:
      structure:
        - at: [0, 0, 0]
          put: *grass
        - at: [0, 0, 1]
          put:
            pattern:
              onlyInsteadOf: *air
              place: *grass-decoration

  fetchGrass:
    type: fetchData
    modelType: grass
    provider:
      type: overpass
      url: &overpass-instance https://overpass.private.coffee/api/interpreter
      query: ( way[landuse="grass"]; way[leisure="garden"]; way[leisure="park"]; )
    <<: *overpass-retry-policy

  renderGrassGround:
    after:
      - fetchGrass
      - renderGround
    type: renderSurfaces
    models:
      type: grass
    heightmap: ground
    place:
      structure:
        - at: [0, 0, 0]
          put: *grass
        - at: [0, 0, 1]
          put:
            pattern:
              onlyInsteadOf: *air
              place: *grass-decoration

  # Convenience task telling ground is built
  ground:
    type: noOperation
    after:
      - renderSquareGround
      - renderGrassGround

  # Fields

  fields:
    type: schedule
    using: ground
    do:
      fetchFields:
        type: fetchData
        modelType: field
        provider:
          type: wfs
          url: https://data.geopf.fr/wfs/wfs
          features: RPG.LATEST:parcelles_graphiques
        <<: *wfs-retry-policy
        postProcessing:
          - type: copy
            metadata: code_cultu
            to: crop
          - type: remap
            metadata: crop
            toFrom:
              # Special values:
              # "none" is set for surfaces that won't be rendered (not a field).
              # "common" is set for all type of culture we don't want a specific rendering.
              # "unknown" is set for all unknown "code_cultu". Could be replaced later with "common".
              none: [BFS, BOR, BTA, CSS, MRS, SNE, TCR]
              common: [ACP, AFG, CAC, CAG, CID, CIT, CML, CPL, CSA, LDH, LDP, LEC, LOT, LUZ, MCS, MLC, MLF, MLG, MLT, MOH, MPC, MSW, OAG, OHR, PAG, PHF, PHI, PHS, PPR, SAG, SHD, SOG, SRS, ZZZ]
              banana: [BCA, BEF]
              barley: [AVH, AVP, ORH, ORP]
              carrot: [CAR]
              corn: [MID, MIS]
              cucumber: [CCN]
              flower: [HPC]
              hemp: [CHV, CSE]
              herb: [AAR, AME, ARP, GES, OEI, PME, PRF, SAI, SGE, TAB, VES, VNL]
              hop: [HBL]
              lavender: [LAV]
              linen: [LIF, LIH, LIP]
              meadow: [GRA, JAC, JNO, PPH, PTR, SIN, SNU, SPH, SPL, TRE]
              orchard: [AGR, ANA, CBT, CNA, CNE, OLI, PEP, PEV, PPP, PRU, PVT, PWT, SBO]
              potato: [PTC]
              rapeseed: [CZH, CZP]
              rice: [RIZ]
              rye: [SGH, SGP]
              soya: [SOJ]
              sunflower: [TRN]
              tomato: [TOM]
              trees: [CAE, CEE, CTG, NOS, NOX, TRU]
              vegetable: [AIL, ARA, ART, BTN, CEL, CHU, EPI, FEV, FLA, FLP, FNU, FRA, FVL, FVP, LBF, MDI, MLO, MOT, NVT, OIG, PCH, PFR, POR, POT, PSL, PVP, RDI, TBT]
              vine: [VRC, VRG]
              wheat: [BDH, BDP, BTH, BTP, CAH, EPE, MCR, TTH, TTP]
            default: unknown

      renderCommon:
        after:
          - fetchFields
          - ground
        type: renderSurfaces
        models:
          type: field
          filter:
            metadata: crop
            in: [common, barley, rapeseed, wheat]
        heightmap: ground
        place: *field-common

      renderSunflower:
        after:
          - fetchFields
          - ground
        type: renderSurfaces
        models:
          type: field
          filter:
            metadata: crop
            equals: sunflower
        heightmap: ground
        place: *field-sunflower

      renderCorn:
        after:
          - fetchFields
          - ground
        type: renderSurfaces
        models:
          type: field
          filter:
            metadata: crop
            equals: corn
        heightmap: ground
        place: *field-corn

      renderLinen:
        after:
          - fetchFields
          - ground
        type: renderSurfaces
        models:
          type: field
          filter:
            metadata: crop
            equals: linen
        heightmap: ground
        place: *field-linen

      renderSoya:
        after:
          - fetchFields
          - ground
        type: renderSurfaces
        models:
          type: field
          filter:
            metadata: crop
            equals: soya
        heightmap: ground
        place: *field-soya

      renderVegetable:
        after:
          - fetchFields
          - ground
        type: renderSurfaces
        models:
          type: field
          filter:
            metadata: crop
            equals: vegetable
        heightmap: ground
        place: *field-vegetable

      renderMeadow:
        after:
          - fetchFields
          - ground
        type: renderSurfaces
        models:
          type: field
          filter:
            metadata: crop
            equals: meadow
        heightmap: ground
        place: *field-meadow

      fetchVineyards:
        type: fetchData
        modelType: vineyard
        provider:
          type: overpass
          url: *overpass-instance
          query: way[landuse="vineyard"]
        <<: *overpass-retry-policy

      renderVineyards:
        after:
          - fetchVineyards
          - ground
        type: renderSurfaces
        models:
          type: vineyard
        heightmap: ground
        place: *vineyard

  # Water

  fetchWater:
    type: fetchData
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique
    <<: *wfs-retry-policy

  flattenWater:
    after:
      - fetchWater
      - altitude
    type: copyHeightmap
    models:
      type: water
    from:
      localMin: ground
      range: 15
    to: ground

  populateWaterPresence:
    after: fetchWater
    type: copyHeightmap
    models:
      type: water
    from: 1
    to: water

  computePoolDepth:
    after: populateWaterPresence
    type: copyHeightmap
    models:
      type: water
      filter:
        metadata: nature
        in: [ Réservoir-bassin ]
    from:
      remap:
        manhattan: water
        maximumDistance: 5
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 2
        3..4: 3
        5: 4
    to: water

  computeWaterDepth:
    after: populateWaterPresence
    type: copyHeightmap
    models:
      type: water
      filter:
        not:
          metadata: nature
          in: [ Réservoir-bassin ]
    from:
      remap:
        manhattan: water
        maximumDistance: 14
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 3
        3: 5
        4: 6
        5: 7
        6..7: 8
        8..10: 9
        10..13: 10
        14: 11
    to: water

  renderWater:
    after:
      - ground
      - computeWaterDepth
      - computePoolDepth
    type: renderHeightmap
    minimum:
      sum:
        - ground
        - 1
        - product: [ -1, water ]
    maximum: ground
    place: *water

  # Buildings 3d

  fetchBatiCity:
    type: fetchData
    modelType: building-city
    provider:
      type: cityjson
      filePath: data/bati-valencay.city.json

  renderBati3dGround:
    after:
      - fetchBatiCity
      - ground
      - roads
    type: renderBuildings3d
    models:
      type: building-city
    surfaceType: ground
    place:
      structure:
        put: *buildings-ground
        at: [0, 0, -10..0]

  renderBati3dWallsOther:
    after: renderBati3dGround
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        not:
          or:
            - metadata: nature
              in: [ "Chapelle", "Eglise", "Château" ]
            - metadata: usage_1
              in: [ "Résidentiel", "Commercial et services" ]
    surfaceType: wall
    place: *buildings-walls-default

  renderBati3dWallsReligieux:
    after: renderBati3dGround
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: nature
        in: [ "Chapelle", "Eglise", "Château" ]
    surfaceType: wall
    place: *buildings-walls-church

  renderBati3dWallsResidentiel:
    after: renderBati3dGround
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        and:
          - metadata: usage_1
            equals: "Résidentiel"
          - not:
              metadata: nature
              in: [ "Chapelle", "Eglise", "Château" ]
    surfaceType: wall
    place: *buildings-walls-residential

  renderBati3dWallsCommercialServices:
    after: renderBati3dGround
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        and:
          - metadata: usage_1
            equals: "Commercial et services"
          - not:
              metadata: nature
              in: [ "Chapelle", "Eglise", "Château" ]
    surfaceType: wall
    place: *buildings-walls-commercial

  bati3dWalls:
    type: noOperation
    after:
      - renderBati3dWallsOther
      - renderBati3dWallsReligieux
      - renderBati3dWallsResidentiel
      - renderBati3dWallsCommercialServices

  # roof material codes: https://piece-jointe-carto.developpement-durable.gouv.fr/NAT004/DTerNP/html3/annexes/desc_pb40_pevprincipale_dmatto.html

  renderBati3dRoofsOther:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        not:
          or:
            - metadata: materiaux_de_la_toiture
              in: [ "1", "01", "10", "11", "19", "91", "3", "03", "30", "33", "13", "31", "12", "21", "2", "02", "20", "22", "4", "04", "44", "40" ]
            - metadata: nature
              in: [ "Chapelle", "Eglise", "Château" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buildings-roof-default

  renderBati3dRoofsTiles:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "1", "01", "10", "11", "19", "91" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buildings-roof-tiles

  renderBati3dRoofsZinc:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "3", "03", "30", "33" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buildings-roof-zinc

  renderBati3dRoofsZincTile:
