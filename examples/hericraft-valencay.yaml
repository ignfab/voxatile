  # Fences

  fetchFences:
    type: fetchData
    modelType: fences
    provider:
      type: overpass
      url: *overpass-instance
      query: way[barrier="fence"]
    <<: *overpass-retry-policy

  renderFences:
    after:
      - fetchFences
      - ground
      #- metroStations
    type: renderLines
    models:
      type: fences
      filter:
        metadata: barrier
        equals: fence
    structure: *fence-structure
    stickToHeightmap: ground

  # Benches

  fetchBenches:
    type: fetchData
    modelType: benches
    provider:
      type: overpass
      url: *overpass-instance
      query: node[amenity="bench"]
    <<: *overpass-retry-policy

  renderBenches:
    after:
      - fetchBenches
      - roads
    type: renderSurfaces
    models:
      type: benches
    place:
      pattern:
        place: *bench
        neverInsteadOf: *water
    heightmap: ground

