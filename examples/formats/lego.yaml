  - &road-bed
    ref: 3003.dat
    color: 83
  - &sidewalk
    ref: 3003.dat
    color: 7
  - &sidewalk-bed
    ref: 3003.dat
    color: 7
  - &cycle-path
    ref: 3003.dat
