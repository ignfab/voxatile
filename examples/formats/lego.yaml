format: lego
references:

  # BASE VOXELS

  - &air
    ref: remove
    color: -1 # Fake color to remove brick
  - &water
    ref: 3003.dat
    color: 39
  - &underground
    ref: 30145.dat
    color: 7
  - &grass
    ref: 30145.dat
    color: 10
  - &grass-decoration
    - pattern:
        chance: 0.01
        seed: grass-rot-1
        place:
          ref: 15279.dat
          color: 74
          lduOffsetY: 24
    - pattern:
        chance: 0.01
        seed: grass-rot-2
        place:
          ref: 15279.dat
          color: 74
          lduOffsetY: 24
          rotationAroundY: 90
    - pattern:
        chance: 0.01
        seed: grass-rot-3
        place:
          ref: 15279.dat
          color: 74
          lduOffsetY: 24
          rotationAroundY: 180
    - pattern:
        chance: 0.01
        seed: grass-rot-4
        place:
          ref: 15279.dat
          color: 74
          lduOffsetY: 24
          rotationAroundY: 270

  # BUILDINGS

  - &buildings-ground
    structure:
      - put:
          ref: 30145.dat
          color: 71
        at: [ 0, 0, 0 ]
      - put:
          ref: remove
          color: -1
        at: [ 0, 0, -2..-1 ]
  - &buildings-walls-default
    ref: 3003.dat
    color: 18
  - &buildings-walls-church
    ref: 3003.dat
    color: 72
  - &buildings-walls-residential
    pattern:
      repeatStructure:
        - at: [ 0..3, 0..3, 0..9 ]
          put:
            ref: 3003.dat
            color: 18
        - at: [ 0..1, 0..1, 4..8 ]
          put:
            ref: 3003.dat
            color: 47
        - at: [ 2..3, 2..3, 4..8 ]
          put:
            ref: 3003.dat
            color: 47
  - &buildings-walls-commercial
    pattern:
      repeatStructure:
        - at: [ 0..3, 0..3, 0..9 ]
          put:
            ref: 3003.dat
            color: 28
        - at: [ 0..1, 0..1, 4..8 ]
          put:
            ref: 3003.dat
            color: 47
        - at: [ 2..3, 2..3, 4..8 ]
          put:
            ref: 3003.dat
            color: 47
  - &buildings-roof-default
    ref: 3003.dat
    color: 7
  - &buildings-roof-zinc
    ref: 3003.dat
    color: 503
  - &buildings-roof-zinc-tiles
    ref: 3003.dat
    color: 503
  - &buildings-roof-church
    ref: 3003.dat
    color: 0
  - &buildings-roof-slates-tiles
    ref: 3003.dat
    color: 0
  - &buildings-roof-slates
    ref: 3003.dat
    color: 0
  - &buildings-roof-concrete
    ref: 3003.dat
    color: 20

  # ROADS

  - &path
    ref: 3003.dat
    color: 70
  - &road-paint
