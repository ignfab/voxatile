  - &stairs
    ref: 3003.dat
    color: 71

  # VEGETATION

  - &tree-trunk
    ref: 3003.dat
    color: 6
  - &tree-leaves
    structure:
      at: [-1..1, -1..1, -1..1]
      put:
        pattern:
          onlyInsteadOf:
            ref: 3003.dat
            color: -1 # Fake color to remove brick
          place:
            pattern:
              seed: tree-leaves-1
              chance: 0.4
              place:
                - ref: 3003.dat
                  color: 2
                - pattern:
                    seed: tree-leaves-2
                    chance: 0.5
                    place:
                      ref: 3003.dat
                      color: 288
  # List of possible tree leaves in *tree-leaves
  - &tree-leaves-list
    - ref: 3003.dat
      color: 2
    - ref: 3003.dat
      color: 288

  # OTHER URBAN STUFF

  - &plazza
    ref: 3003.dat
    color: 7
  - &metro-station-steps
    ref: 3003.dat
    color: 19
  - &metro-station-walls-top
    ref: 3003.dat
    color: 7
  - &metro-station-walls
    ref: 3003.dat
    color: 19
  - &fence-structure # 30256.dat
    - put:
        ref: 3003.dat
        color: 151
      at: [0, 0, 1]
    - put:
        ref: 14918.dat
        color: 151
        lduOffsetX: -10
        lduOffsetY: 24
        lduOffsetZ: -10
      at: [0, 0, 2]
  - &linear-bench-structure
    axes: [z, y]
    blueprint:
      - "O  "
      - "O  "
      - "OOO"
    with:
      "O":
        ref: 3003.dat
        color: 86
    zOffset: 1
  - &bench
    structure:
      - put:
          ref: 2041.dat
          color: 86
        at: [ 0, 0, 1 ]
  - &traffic-light
    structure:
      axes: [ z ]
      blueprint: "1    23456"
      with:
        "1":
          ref: 30256.dat
          color: 0
          lduOffsetY: 16
        "2":
          ref: 3003.dat
          color: 0
        "3":
          ref: 3003.dat
          color: 35
        "4":
          ref: 3003.dat
          color: 38
        "5":
          ref: 3003.dat
          color: 36
        "6":
          ref: 3068a.dat
          color: 0
          lduOffsetY: 16
      zOffset: 1
  - &city-light
    structure:
      axes: [ z ]
      blueprint: "1      23"
      with:
        "1":
          ref: 11062.dat # 2039.dat
          color: 72
          lduOffsetY: -144
        "2":
          ref: 3626b.dat
          color: 47
        "3":
          ref: 4740.dat
          color: 72
          lduOffsetY: 16
      zOffset: 1
