format: minecraft
references:
  - &voxel-stone minecraft:stone
  - &voxel-dirt minecraft:dirt
  - &voxel-cobble minecraft:cobblestone
  - &voxel-empty minecraft:air
  - &voxel-building-ground minecraft:stone_bricks
  - &voxel-grass minecraft:grass_block
  - &voxel-glass minecraft:glass
  - &voxel-forest-ground minecraft:podzol
  - &forest-grass minecraft:fern
  - &forest-tree1
    structure:
      - put:
          pattern:
            place:
              block: minecraft:oak_leaves
              properties:
                persistent: true
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: minecraft:oak_log
        at: [ 0, 0, 0..5 ]
  - &forest-tree2
    structure:
      - put:
          pattern:
            place:
              block: minecraft:birch_leaves
              properties:
                persistent: true
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: minecraft:birch_log
        at: [ 0, 0, 0..5 ]
  - &voxel-water minecraft:water
  - &voxel-air minecraft:air
  - &structure-upper-floor
    structure:
      with:
        'b': minecraft:sandstone
        'g': minecraft:glass
      axes: [ z, x ]
      blueprint:
        - "bbbb"
        - "bggb"
        - "bbbb"
    elasticAtX: 2
  - &structure-ground-floor
    structure:
      with:
        'g': minecraft:glass
        'b': minecraft:end_stone_bricks
      axes: [ z, x ]
      blueprint:
        - "bbbb"
        - "bggb"
        - "bbbb"
        - "bbbb"
    elasticAtX: 2
    elasticAtZ: 1
