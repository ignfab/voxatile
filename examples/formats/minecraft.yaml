  - &fire-hydrant
    structure:
      - put: minecraft:red_wool
        at: [ 0, 0, 1..3 ]
      - put: minecraft:red_wool
        at: [ 0, 1, 2 ]
  - &trash-can
    structure:
      - put: minecraft:cauldron
        at: [ 0, 0, 1 ]
  - &pic-nic
    structure:
      axes: [ z, x, y ]
      blueprint:
        - - "     "
          - "OOOOO"
          - "OOOOO"
          - "OOOOO"
          - "     "
        - - "OOOOO"
          - "+   +"
          - "     "
          - "+   +"
          - "OOOOO"
        - - "v   v"
          - "|   |"
          - "=   ="
          - "|   |"
          - "^   ^"
      with:
        "O": minecraft:oak_slab
        "+": minecraft:oak_fence
        "|": minecraft:oak_fence[east=true,west=true]
        "v": minecraft:oak_fence[west=true]
        "^": minecraft:oak_fence[east=true]
