format: minecraft
references:

  # BASE VOXELS

  - &air minecraft:air
  - &water minecraft:water
  - &underground minecraft:stone
  - &grass minecraft:grass_block
  - &grass-decoration
    - pattern: # TODO: need a "random choose" rather than place over (specially for choosing structures)
        chance: 0.04
        place: minecraft:short_grass
    - pattern:
        chance: 0.02
        place: minecraft:fern

    # BUILDINGS

  - &buildings-ground minecraft:cobblestone
  - &buildings-walls-default minecraft:sandstone
  - &buildings-walls-church minecraft:stone_bricks
  - &buildings-walls-residential
    pattern:
      repeatStructure:
        - at: [ 0..3, 0..3, 0..6 ]
          put: minecraft:sandstone
        - at: [ 0..1, 0..1, 3..5 ]
          put: minecraft:glass
        - at: [ 2..3, 2..3, 3..5 ]
          put: minecraft:glass
  - &buildings-walls-commercial
    pattern:
      repeatStructure:
        - at: [ 0..3, 0..3, 0..6 ]
          put: minecraft:bricks
        - at: [ 0..1, 0..1, 3..5 ]
          put: minecraft:glass
        - at: [ 2..3, 2..3, 3..5 ]
          put: minecraft:glass
  - &buidlings-roof-default minecraft:polished_andesite
  - &buidlings-roof-zinc minecraft:smooth_quartz
  - &buidlings-roof-zinc-tiles minecraft:quartz_block
  - &buidlings-roof-church minecraft:polished_blackstone_bricks
  - &buidlings-roof-slates-tiles minecraft:polished_basalt
  - &buidlings-roof-slates minecraft:basalt
  - &buidlings-roof-concrete minecraft:clay

  # ROADS

  - &path minecraft:dirt_path
  - &road-paint minecraft:smooth_quartz_slab
  - &road-tar minecraft:blackstone_slab
  - &road-bed minecraft:blackstone
  - &sidewalk minecraft:smooth_stone
  - &sidewalk-bed minecraft:smooth_stone
  - &cycle-path minecraft:granite

  # VEGETATION

  - &tree-trunk minecraft:oak_log
  - &tree-leaves
    - minecraft:oak_leaves[persistent=true]
    - pattern:
        chance: 0.5
        place: minecraft:birch_leaves[persistent=true]
        seed: birch
  # List of possible tree leaves in *tree-leaves
  - &tree-leaves-list
    - minecraft:oak_leaves[persistent=true]
    - minecraft:birch_leaves[persistent=true]

  # OTHER URBAN STUFF

  - &metro-station-steps minecraft:smooth_sandstone
  - &metro-station-walls-top minecraft:smooth_stone
  - &metro-station-walls minecraft:cut_sandstone
  - &fence-structure
    - put: minecraft:smooth_stone
      at: [ 0, 0, 1 ]
    - put: minecraft:oak_fence
      at: [ 0, 0, 2 ]
  - &linear-bench-structure
    axes: [ z, y ]
    blueprint:
      - "O  "
      - "O  "
      - "OOO"
    with:
      "O": minecraft:oak_planks
    zOffset: 1
  - &bench
    structure:
      - put: minecraft:dark_oak_slab[type=top]
        at: [ 0, -2, 1 ]
      - put: minecraft:dark_oak_slab
        at: [ 0, -1..1, 1 ]
      - put: minecraft:dark_oak_slab[type=top]
        at: [ 0, 2, 1 ]
  - &traffic-light
    structure:
      axes: [ z ]
      blueprint: "1111123456"
      with:
        "1": minecraft:blackstone_wall
        "2": minecraft:blackstone
        "3": minecraft:green_wool
        "4": minecraft:orange_wool
        "5": minecraft:red_wool
        "6": minecraft:blackstone_slab
      zOffset: 1
  - &city-light
    structure:
      - axes: [ z, x, y ]
        blueprint:
          - - " S "
            - "S S"
            - " S "
          - - " L "
            - "L*L"
            - " L "
          - - " v "
            - ">X<"
            - " ^ "
        with:
          "X": minecraft:nether_brick_fence[east=true,north=true,west=true,south=true]
          ">": minecraft:nether_brick_fence[north=true]
          "v": minecraft:nether_brick_fence[west=true]
          "<": minecraft:nether_brick_fence[south=true]
          "^": minecraft:nether_brick_fence[east=true]
          "L": minecraft:redstone_lamp
          "S":
            block: minecraft:daylight_detector
            blockEntity: true
            properties:
              inverted: true
          "*": # This is mainly to demonstrate full block entity support
            block: minecraft:player_head
            blockEntity: minecraft:skull
            dataTags: >-
              {
                profile: {
                  properties: [
                    {
                      name: textures,
                      value: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNzI3YmY4NzY0MzVlMDRkZGU5ZGExOTkyNDMxNWFlNTlhOGVmYzI3YWYxZGRiZWY4MTNkODljZmFmZmU5MTY0NyJ9fX0="
                    }
                  ]
                }
              }
        xOffset: -1
        yOffset: -1
        zOffset: 11
      - at: [ 0, 0, 1..10 ]
        put: minecraft:nether_brick_fence
  - &fire-hydrant
    structure:
      - put: minecraft:red_wool
        at: [ 0, 0, 1..3 ]
      - put: minecraft:red_wool
        at: [ 0, 1, 2 ]
  - &trash-can
    structure:
      - put: minecraft:cauldron
        at: [ 0, 0, 1 ]
  - &pic-nic
    structure:
      axes: [ z, x, y ]
      blueprint:
        - - "     "
          - "OOOOO"
          - "OOOOO"
          - "OOOOO"
          - "     "
        - - "OOOOO"
          - "+   +"
          - "     "
          - "+   +"
          - "OOOOO"
        - - "v   v"
          - "|   |"
          - "=   ="
          - "|   |"
          - "^   ^"
      with:
        "O": minecraft:oak_slab
        "+": minecraft:oak_fence
        "|": minecraft:oak_fence[east=true,west=true]
        "v": minecraft:oak_fence[west=true]
        "^": minecraft:oak_fence[east=true]
        "=": minecraft:oak_fence_gate
      zOffset: 1
