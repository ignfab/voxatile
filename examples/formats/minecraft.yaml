format: minecraft
references:
  - &voxel-stone minecraft:stone
  - &voxel-dirt minecraft:dirt
  - &voxel-cobble minecraft:cobblestone
  - &voxel-empty minecraft:air
  - &voxel-building-ground minecraft:stone_bricks
  - &voxel-grass minecraft:grass_block
  - &voxel-glass minecraft:glass
  - &voxel-forest-ground minecraft:podzol
  - &road-paint minecraft:white_concrete
  - &road-tar minecraft:black_concrete
  - &path minecraft:grass_path
  - &forest-grass minecraft:fern
  - &forest-tree1
    structure:
      - put:
          pattern:
            place:
              block: minecraft:oak_leaves
              properties:
                persistent: true
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: minecraft:oak_log
        at: [ 0, 0, 0..5 ]
  - &forest-tree2
    structure:
      - put:
          pattern:
            place:
              block: minecraft:birch_leaves
              properties:
                persistent: true
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: minecraft:birch_log
        at: [ 0, 0, 0..5 ]
  - &voxel-water minecraft:water
  - &voxel-air minecraft:air
  - &minimap-color-palette
      # https://minecraft.wiki/w/Map_item_format#Color_table
      minecraft:stone: [112, 112, 112]
      minecraft:dirt: [151, 109, 77]
      minecraft:cobblestone: [112, 112, 112]
      minecraft:stone_bricks: [112, 112, 112]
      minecraft:grass_block: [127, 178, 56]
      minecraft:podzol: [129, 86, 49]
      minecraft:dirt_path: [151, 109, 77]
      minecraft:fern: [0, 124, 0]
      minecraft:oak_leaves: [0, 124, 0]
      minecraft:birch_leaves: [0, 124, 0]
      minecraft:water: [64, 64, 255, 180] 
      minecraft:white_wool: [255, 255, 255]
      minecraft:black_wool: [25, 25, 25]
