format: luanti
references:
  - &voxel-stone default:stone
  - &voxel-dirt default:dirt
  - &voxel-cobble default:cobble
  - &voxel-empty default:air
  - &voxel-building-ground default:stonebrick
  - &voxel-grass default:dirt_with_grass
  - &voxel-glass default:glass
  - &voxel-forest-ground default:dirt_with_rainforest_litter
  - &road-paint wool:white
  - &road-tar wool:black
  - &path default:dirt_with_coniferous_litter
  - &forest-grass default:junglegrass
  - &forest-tree1
    structure:
      - put:
          pattern:
            place: default:leaves
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: default:tree
        at: [ 0, 0, 0..5 ]
  - &forest-tree2
    structure:
      - put:
          pattern:
            place: default:aspen_leaves
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: default:aspen_tree
        at: [ 0, 0, 0..5 ]
  - &voxel-water default:water_source
  - &voxel-air air
  - &minimap-color-palette
      # https://github.com/luanti-org/minetestmapper/blob/master/colors.txt
      default:stone: [97, 94, 93]
      default:dirt: [97, 67, 43]
      default:cobble: [89, 86, 84]
      default:stonebrick: [102, 99, 98]
      default:dirt_with_grass: [64, 111, 26]
      default:dirt_with_rainforest_litter: [76, 39, 10]
      default:dirt_with_coniferous_litter: [109, 90, 71]
      default:junglegrass: [67, 110, 28]
      default:leaves: [36, 55, 29]
      default:aspen_leaves: [72, 105, 29]
      default:water_source: [39, 66, 106, 128]
      wool:white: [220, 220, 220]
      wool:black: [30, 30, 30]
      default:snowblock: [225, 225, 238]
