format: luanti
references:
  - &voxel-stone default:stone
  - &voxel-dirt default:dirt
  - &voxel-cobble default:cobble
  - &voxel-empty default:air
  - &voxel-building-ground default:stonebrick
  - &voxel-grass default:dirt_with_grass
  - &voxel-glass default:glass
  - &voxel-forest-ground default:dirt_with_rainforest_litter
  - &road-paint wool:white
  - &road-tar wool:black
  - &path default:dirt_with_coniferous_litter
  - &forest-grass default:junglegrass
  - &forest-tree1
    structure:
      - put:
          pattern:
            place: default:leaves
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: default:tree
        at: [ 0, 0, 0..5 ]
  - &forest-tree2
    structure:
      - put:
          pattern:
            place: default:aspen_leaves
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: default:aspen_tree
        at: [ 0, 0, 0..5 ]
  - &voxel-water default:water_source
  - &voxel-air air
  - &voxel-leaves default:leaves
  - &voxel-tree default:tree
  - &voxel-pine-needles default:pine_needles
  - &voxel-pine-tree default:pine_tree
  - &voxel-sand default:sand
  - &dry-grass-sparse default:dry_grass_3
  - &dry-grass-short default:dry_grass_4
  - &dry-grass-tall default:dry_grass_5
  - &bush-stem default:bush_stem
  - &bush-leaves default:bush_leaves
  - &grass-tuft default:grass_3
  - &grass-tall default:grass_4
  - &flower-yellow flowers:dandelion_yellow
  - &flower-red flowers:rose
  - &reed default:papyrus
  - &voxel-paving default:stone_block
  - &voxel-gravel default:gravel
  - &voxel-metal default:steelblock
  - &voxel-stonebrick default:stonebrick
  - &voxel-slab-wood stairs:slab_wood
  - &voxel-roof default:desert_stone_block
  - &voxel-wall default:sandstonebrick
  - &voxel-planks default:wood
  - &grass-low default:grass_2
  - &voxel-mossy default:mossycobble
  - &voxel-silver-sand default:silver_sand
