format: luanti
references:
  - &voxel-stone default:stone
  - &voxel-dirt default:dirt
  - &voxel-cobble default:cobble
  - &voxel-empty default:air
  - &voxel-building-ground default:stonebrick
  - &voxel-grass default:dirt_with_grass
  - &voxel-glass default:glass
  - &voxel-forest-ground default:dirt_with_rainforest_litter
  - &road-paint wool:white
  - &road-tar wool:black
  - &path default:dirt_with_coniferous_litter
  - &forest-grass default:junglegrass
  - &forest-tree1
    structure:
      - put:
          pattern:
            place: default:leaves
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: default:tree
        at: [ 0, 0, 0..5 ]
  - &forest-tree2
    structure:
      - put:
          pattern:
            place: default:aspen_leaves
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - put: default:aspen_tree
        at: [ 0, 0, 0..5 ]
  - &voxel-water default:water_source
  - &voxel-air air
  - &windows-one
    with:
      'b': default:silver_sandstone_brick
      'g': default:obsidian_glass
      'o': default:stonebrick
    axes: [ z, x ]
    blueprint:
      - "bbb"
      - "bgb"
      - "bbb"
      - "ooo"
  - &door
    with:
      'b': default:silver_sandstone_brick
      'g': doors:door_wood_a
      'o': default:stonebrick
    axes: [ z, x ]
    blueprint:
      - "bbb"
      - "b b"
      - "bgb"
      - "ooo"
  - &windows-two
    with:
      'b': default:sandstone
      'B': default:sandstone_block
      '-': default:glass
    axes: [ z, x ]
    blueprint:
      - "bbb"
      - "b-b"
      - "b-b"
      - "BBB"
  - &left
    with:
      'b': default:sandstone
      'B': default:sandstone_block
      'c': default:desert_sandstone_block
    axes: [ z, x ]
    blueprint:
      - "cb"
      - "cb"
      - "cb"
      - "cB"
  - &right
    with:
      'b': default:sandstone
      'B': default:sandstone_block
      'c': default:desert_sandstone_block
    axes: [ z, x ]
    blueprint:
      - "bc"
      - "bc"
      - "bc"
      - "Bc"
  - &rdc
      - put: default:stone
        at: [ 0, 0, 0 ]
  - &facade-one
    distributedByPriority:
      - resized:
          distributedByPriority:
            - resized:
                repeated:
                  stretched: *windows-one
                  elasticAt:
                    z: [ 3, 1 ]
                axis: [ x ]
                minRepetition: [ 1 ]
              priority: 1
            - resized:
                stretched: *door
                elasticAt:
                  x: [ 2, 1 ]
                  z: [ 3, 1 ]
              priority: 0
            - resized:
                repeated:
                  stretched: *windows-one
                  elasticAt:
                    z: [ 3, 1 ]
                axis: [ x ]
                minRepetition: [ 1 ]
              priority: 1
          axis: x
        priority: 0
      - resized:
          distributedByPriority:
            - resized:
                stretched: *left
                elasticAt:
                  x: [ 1, 0 ]
                  z: [ 0, 1 ]
              priority: 0
            - resized:
                repeated:
                  fixed: *windows-two
                axis: [ x, z ]
                minRepetition: [ 1, 1 ]
              priority: 1
            - resized:
                stretched: *right
                elasticAt:
                  x: [ 0, 0 ]
                  z: [ 0, 1 ]
              priority: 0
          axis: x
        priority: 1
    axis: z
