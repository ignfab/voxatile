heightmaps:
  ground:
    default: 0
  water:
    default: 0
sources:
  mnt:
    modelType: mnt
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix
  bati:
    modelType: building
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
    processor:
      type: geoToolsVector
  surfaceEau:
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique
    processor:
      type: geoToolsVector
renderers:
  altitude:
    after:
      - source:mnt
    type: heightmap
    modelType: mnt
    heightmap: ground
  ground:
    after:
      - renderer:altitude
    type: ground
    heightmap: ground
    voxels:
      GRASS: 1
      DIRT: 3
      STONE: 10
  building:
    after:
      - renderer:altitude
      - source:bati
    type: vector
    modelType: building
    heightmap: ground
    inside: COBBLE
    edge: STONE
  waterDepth:
    after:
      - source:surfaceEau
    type: waterDepth
    modelType: water
    heightmap: water
    depth: 5
  water:
    after:
      - renderer:waterDepth
      - renderer:ground
    type: water
    groundHeightmap: ground
    waterHeightmap: water
    waterVoxel: STONE
verticalScale: 1.0
horizontalScale: 1.0
area:
  center:
    latitude: 44.4523
    longitude: 6.3935
    #latitude: 48.842
    #longitude: 2.420
  extendX: 1000
  extendY: 1000
crs: EPSG:2154
format: minetest
