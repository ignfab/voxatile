worldName: Centre Pompidou
verticalScale: 1.0
horizontalScale: 1.0
area:
  center:
    latitude: 48.8601
    longitude: 2.3509
  extentX: 500
  extentY: 500

format: luanti

references:
  - &forest-tree1
    structure:
      - place:
          pattern:
            place: default:leaves
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - place: default:tree
        at: [ 0, 0, 0..5 ]
  - &forest-tree2
    structure:
      - place:
          pattern:
            place: default:aspen_leaves
            chance: 0.8
        at: [ -3..3, -3..3, 4..10 ]
      - place: default:aspen_tree
        at: [ 0, 0, 0..5 ]
  - &corner-material default:desert_sandstone_block
  - &other-material default:desert_stone
  - &cornice-material default:desert_sandstone_block
  - &facade-residential-materials
    "-": default:sandstone
    "+": *other-material
    "O": default:desert_sandstone_block
    "*": default:obsidian_glass
    "=": default:sandstonebrick
    "|": default:fence_junglewood
  - &modern-wall default:clay
  - &modern-materials
    "O": *modern-wall
    "*": default:obsidian_glass

heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  altitude:
    type: sequence
    do:
    - type: fetchData
      modelType: altitude
      provider:
        type: wmsFloat
        url: https://data.geopf.fr/wms-r/wms
        layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
      retry: 1
      retryDelay: 1
    - type: populateHeightmap
      models:
        type: altitude
      heightmap: ground
    - type: setSpawn
      heightmap:
        sum: [ground, 1]
      x: 0
      y: 0

  fetchBuildings:
    type: fetchData
    modelType: buildings
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    retry: 1
    retryDelay: 1
    postProcessing:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: truncate
        metadata: height
        method: round
        ifMissing: ignore
      - type: default
        metadata: height
        value: 5
        as: integer

  fetchWater:
    type: fetchData
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique
    retry: 1
    retryDelay: 1

  fetchRoads:
    type: fetchData
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route
    retry: 1
    retryDelay: 1

  flattenWater:
    after:
      - fetchWater
      - altitude
    type: copyHeightmap
    models:
      type: water
    from:
      localMin: ground
      range: 9
    to: ground

  renderGround:
    after:
      - altitude
      - flattenWater
    type: renderHeightmap
    at: ground
    place:
      structure:
        - place: default:stone
          at: [0, 0, -20..0]

  computeBuildingsAltitude:
    after:
      - fetchBuildings
      - renderGround
    type: computeHeightmapStats
    models:
      type: buildings
    heightmap: ground
    compute:
      minimum: minimum-ground-altitude
      maximum: ground-floor-altitude

  flattenGroundBuildings:
    after:
      - computeBuildingsAltitude
    type: fillBetweenHeightmapAndValue
    models:
      type: buildings
    heightmap: ground
    altitudeValue:
      metadata: ground-floor-altitude
    placeAbove: air
    placeBelow: default:stonebrick

  fetchVegetation:
    type: fetchData
    modelType: vegetation
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:zone_de_vegetation
    retry: 1
    retryDelay: 1

  renderVegetation:
    after:
      - renderGround
      - fetchVegetation
    type: sequence
    models:
      type: vegetation
    do:
      - type: renderSurfaces
        heightmap: ground
        place:
          - default:dirt_with_grass
          - pattern:
              seed: grass
              chance: 0.1
              place:
                structure:
                  - at: [0, 0, 1]
                    place: default:grass_3
      - type: renderSurfaces
        heightmap: ground
        models:
          filter:
            metadata: nature
            in:
              - "Bois"
              - "Forêt fermée de conifères"
              - "Forêt fermée de feuillus"
              - "Forêt fermée mixte"
              - "Forêt ouverte"
              - "Zone arborée"
        place:
          - pattern:
              seed: forest-grass
              chance: 0.1
              place:
                structure:
                  - at: [0, 0, 1]
                    place: default:junglegrass
          - pattern:
              seed: forest-tree1
              chance: 0.01
              place: *forest-tree1
          - pattern:
              seed: tree2
              chance: 0.003
              place: *forest-tree2


  populateWaterPresence:
    after: fetchWater
    type: copyHeightmap
    models:
      type: water
    from: 1
    to: water

  computeWaterDepth:
    after: populateWaterPresence
    type: copyHeightmap
    models:
      type: water
    from:
      remap:
        manhattan: water
        maximumDistance: 12
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 8
        3..3: 10
        4..6: 11
        7..12: 12
    to: water

  renderWater:
    after:
      - renderGround
      - computeWaterDepth
      # Vegetation and water vector data overlap in certain areas. (Because of vegetation representing canopy)
      # The dependency and air voxel below should be removed when cropping is implemented on vector data.
      - renderVegetation
    type: renderHeightmap
    minimum:
      sum:
        - ground
        - 1
        - product: [ -1, water ]
    maximum: ground
    place:
      structure:
        - place: default:water_source
          at: [ 0, 0, 0 ]
        # This a dirt fix to remove vegetation on water
        - place: air
          at: [ 0, 0, 1..12 ]

  renderPath:
    after:
      - fetchRoads
      - renderGround
      - renderVegetation
    type: renderLines2d
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Chemin", "Sentier", "Route empierrée", "Escalier" ]
    width:
      firstOf:
        - metadata: largeur_de_chaussee
        - 3
    place:
      structure:
        - at: [0, 0, 0]
          place: default:dirt_with_coniferous_litter
        - at: [0, 0, 1..2]
          place: air
    heightmap: ground

  renderRoads:
    after: renderPath
    type: sequence
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    do:
      - type: renderLines2d
        heightmap: ground
        width:
          firstOf:
            - sum:
                - metadata: largeur_de_chaussee
                - 1.5
            - 6.5
        place:
          structure:
            - at: [0, 0, 0]
              place: wool:white
            - at: [0, 0, 1..4]
              place: air
      - type: renderLines2d
        heightmap: ground
        width:
          firstOf:
            - metadata: largeur_de_chaussee
            - 4
        place: wool:black

  renderResidentialBuildings:
    after:
      - flattenGroundBuildings
    models:
      type: buildings
      filter:
        metadata: usage_1
        equals: Résidentiel
    type: sequence
    do:
      - type: renderRoof
        roofType: hipped
        altitude:
          sum:
            - metadata: ground-floor-altitude
            - metadata: height
        place: default:stone
      - type: renderFacades
        height: height
        altitude: ground-floor-altitude
        # TODO: Layout should probably be defined on a common.yaml file in format.
        build:
          - along: x
            concatenate:
              # Left corner
              - &corner
                structure:
                  at: [ 0, -1..0, 0 ]
                  place: *corner-material
                stretchableAlongX: { at: 0 }
                stretchableAlongZ: { at: 0 }
                priority: -1
              - along: z
                concatenate:
                  # Ground floor
                  - priority: 1
                    along: x
                    concatenate:
                      - atLeast: 0
                        along: x
                        repeat:
                          structure:
                            axes: [ z, x ]
                            blueprint: [ "-O==O", "-O**O", "-O**O", "-O**O", "-O==O", "-O--O" ]
                            with: *facade-residential-materials
                          stretchableAlongZ: { at: 0 }
                      # Door
                      - structure:
                          axes: [ z, x ]
                          blueprint: [ "-O==O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-" ]
                          with: *facade-residential-materials
                        stretchableAlongZ: { at: 0 }
                      # Right ground windows
                      - along: x
                        atLeast: 0
                        repeat:
                          structure:
                            axes: [ z, x ]
                            blueprint: [ "O==O-", "O**O-", "O**O-", "O**O-", "O==O-", "O--O-" ]
                            with: *facade-residential-materials
                          stretchableAlongZ: { at: 0 }
                  # Cornice
                  - structure:
                      at: [ 0, 0, 0 ]
                      place: *cornice-material
                    stretchableAlongX: { at: 0 }
                  # Upper floors
                  - priority: 2
                    along: z
                    atLeast: 0
                    repeat:
                      along: x
                      concatenate:
                        - structure:
                            at: [ 0, 0, 0..5 ]
                            place: *other-material
                        - along: x
                          repeat:
                            structure:
                              axes: [ y, z, x ]
                              blueprint:
                                - [ "O==O+", "O**O+", "O**O+", "O**O+", "O==O+", "O--O+" ]
                                - [ "     ", "     ", "     ", "|||| ", "==== ", "O  O " ]
                              with: *facade-residential-materials
                              yOffset: -1
                  # Upper cornice
                  - structure:
                      at: [ 0, 0, 0 ]
                      place: *cornice-material
                    stretchableAlongX: { at: 0 }
                    stretchableAlongZ: { at: 0 }
              # Right corner
              - *corner
          - structure:
              at: [ 0, 0, 0 ]
              place: *corner-material
            stretchableAlongX: { at: 0 }
            stretchableAlongZ: { at: 0 }

  renderOfficeBuildings:
    after:
      - flattenGroundBuildings
    type: sequence
    models:
      type: buildings
      filter:
        not:
          metadata: usage_1
          equals: Résidentiel
    do:
      - type: renderRoof
        roofType: flat
        altitude:
          sum:
            - metadata: ground-floor-altitude
            - metadata: height
            - -1
        place: default:stone_block
      - type: renderFacades
        height: height
        altitude: ground-floor-altitude
        # TODO: Layout should probably be defined on a common.yaml file in format.
        build:
          - along: x
            concatenate:
              # Left corner
              - structure:
                  place: *modern-wall
                  at: [0, 0, 0]
                stretchableAlongX:
                  at: 0
                stretchableAlongZ:
                  at: 0
              # Facade
              - priority: 1
                along: z
                concatenate:
                  # Ground floor
                  - along: x
                    concatenate:
                      # Left
                      - along: x
                        repeat:
                          structure:
                            with: *modern-materials
                            axes: [z, x]
                            blueprint: [ "O**", "O**", "O**", "OOO", "OOO"]
                      # Door
                      - structure:
                          with: *modern-materials
                          axes: [z, x]
                          blueprint: [ "OOOO", "O  O", "O  O", "O  O", "O  O" ]
                      # Right
                      - along: x
                        repeat:
                          structure:
                            with: *modern-materials
                            axes: [z, x]
                            blueprint: [ "**O", "**O", "**O", "OOO", "OOO" ]
                  # Upper floors
                  - priority: 1
                    along: x
                    concatenate:
                      - structure:
                          place: *modern-wall
                          at: [0, 0, 0 ]
                        stretchableAlongZ:
                          at: 0
                      - along: x
                        repeat:
                          structure:
                            with: *modern-materials
                            axes: x
                            blueprint: "**O"
                          stretchableAlongZ:
                            at: 0
                  # Top
                  - structure:
                      place: *modern-wall
                      at: [0, 0, 0 ]
                    stretchableAlongX:
                      at: 0
                    stretchableAlongZ:
                      at: 0
              # Left corner
              - structure:
                  place: *modern-wall
                  at: [0, 0, 0]
                stretchableAlongX:
                  at: 0
                stretchableAlongZ:
                  at: 0
          # Default
          - structure:
              at: [ 0, 0, 0 ]
              place: *modern-wall
            stretchableAlongX:
              at: 0
            stretchableAlongZ:
              at: 0
