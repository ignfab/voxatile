heightmaps:
  ground:
    default: 0
sources:
  mnt:
    modelType: mnt
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix
  bati:
    modelType: building
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
    processor:
      type: geoToolsVector
    postProcessors:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: integer
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: default
        metadata: height
        value: 5
        as: integer
renderers:
  altitude:
    after:
      - source:mnt
    type: heightmap
    modelType: mnt
    heightmap: ground
  ground:
    after:
      - renderer:altitude
    type: ground
    heightmap: ground
    place:
      type: stack
      layers:
        - material: minecraft:grass_block
          height: 1
        - material: minecraft:dirt
          height: 3
        - material: minecraft:stone
          height: 10
  building:
    after:
      - renderer:altitude
      - source:bati
    type: vector
    modelType: building
    heightmap: ground
    inside: minecraft:cobblestone
    edge: minecraft:stone
verticalScale: 1.0
horizontalScale: 1.0
area:
  center:
    latitude: 48.845
    longitude: 2.425
  angle: 0
  extendX: 1000
  extendY: 1000
crs: EPSG:2154
format: minecraft
