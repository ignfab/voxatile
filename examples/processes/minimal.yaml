heightmaps:
  ground:
    default: 0

forEachTile:

  renderGround:
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]
