format: minetest

worldName: Stretched
verticalScale: 1
horizontalScale: 1
area:
  center:
    latitude: 48.845
    longitude: 2.425
  extentX: 500
  extentY: 500

references:
  - &facade
    axes: x
    blueprint: "rvb"
    with:
      "r": wool:red
      "v": wool:green
      "b": wool:blue
#    - at: [ -5..5, 0, 0 ]
#      put: wool:green
    xOffset: -3
    stretchX:
      at: -3

forEachTile:

  renderGround:
    type: renderHeightmap
    at: 0
    place: default:stone

  renderFacadeLarge:
    type: debugLayout
    build: *facade
    at:
      x: 0
      y: 50
      z: 1
    size:
      x: 32
