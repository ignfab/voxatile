heightmaps:
  ground:
    default: 0
sources:
  mnt:
    modelType: mnt
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix
  bati:
    modelType: building
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    processor:
      type: geoToolsVector
    postProcessors:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: default
        metadata: height
        value: 5
        as: integer
  vegetation:
    modelType: vegetation
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:zone_de_vegetation
    processor:
      type: geoToolsVector
renderers:
  altitude:
    after:
      - source:mnt
    type: heightmap
    models:
      type: mnt
    heightmap: ground
  ground:
    after:
      - renderer:altitude
    type: ground
    heightmap: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]
  building-leveling:
    after:
      - source:bati
      - renderer:ground
    type: leveling
    models:
      type: building
    heightmap: ground
    filling: default:cobble
  building:
    after:
      - renderer:building-leveling
    type: building
    models:
      type: building
      filter:
        metadata: height
        greaterThan: 0
    heightmap: ground
    roof: *voxel-cobble
    wall: *voxel-stone
    window: *voxel-glass
  forest:
    after:
      - renderer:ground
      - source:vegetation
    type: vector
    models:
      type: vegetation
      filter:
        metadata: nature
        in:
          - "Bois"
          - "Forêt fermée de conifères"
          - "Forêt fermée de feuillus"
          - "Forêt fermée mixte"
          - "Forêt ouverte"
          - "Zone arborée"
    heightmap: ground
    place:
      - pattern:
          seed: forest-grass
          chance: 0.1
          place:
            structure:
              - at: [0, 0, 1]
                put: *forest-grass
      - *voxel-forest-ground
      - pattern:
          seed: forest-tree1
          chance: 0.01
          place: *forest-tree1
      - pattern:
          seed: tree2
          chance: 0.003
          place: *forest-tree2


