heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  altitude:
    type: sequence
    do:
    - type: fetchData
      modelType: altitude
      provider:
        type: wmsFloat
        url: https://data.geopf.fr/wms-r/wms
        layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
      processor:
        type: floatMatrix
    - type: sequence
      do:
        - type: noOperation
        - type: noOperation
        - type: noOperation
    - type: populateHeightmap
      models:
        type: altitude
      heightmap: ground
    - type: setSpawn
      heightmap:
        sum: [ground, 1]
      x: 0
      y: 0

  ground:
    after:
      - altitude
      - flattenWater
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]

  fetchBuildings:
    type: fetchData
    modelType: buildings
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    processor:
      type: geoToolsVector
    postProcessing:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: truncate
        metadata: height
        method: round
        ifMissing: ignore
      - type: default
        metadata: height
        value: 5
        as: integer

  fetchWater:
    type: fetchData
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique
    processor:
      type: geoToolsVector

  fetchRoads:
    type: fetchData
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route
    processor:
      type: geoToolsVector

  flattenWater:
    after:
      - fetchWater
      - altitude
    type: copyHeightmap
    models:
      type: water
    from:
      localMin: ground
      range: 9
    to: ground

  computeBuildingsAltitude:
    after:
      - fetchBuildings
      - ground
    type: computeHeightmapStats
    models:
      type: buildings
    heightmap: ground
    compute:
      minimum: minimum-ground-altitude
      maximum: ground-floor-altitude

  flattenGroundBuildings:
    after:
      - computeBuildingsAltitude
    type: fillBetweenHeightmapAndMetadata
    models:
      type: buildings
    heightmap: ground
    altitudeMetadata: ground-floor-altitude
    placeAbove: *voxel-empty
    placeBelow: *voxel-building-ground

  renderBuildings:
    after: flattenGroundBuildings
    type: renderBuildings
    models:
      type: buildings
      filter:
        metadata: height
        greaterThan: 0
    roof: *voxel-cobble
    wall: *voxel-stone
    window: *voxel-glass

  forest:
    type: sequence
    using: ground
    do:
      - type: fetchData
        modelType: vegetation
        provider:
          type: wfs
          url: https://data.geopf.fr/wfs/wfs
          features: BDTOPO_V3:zone_de_vegetation
        processor:
          type: geoToolsVector
      - type: renderSurfaces
        after: ground
        models:
          type: vegetation
          filter:
            metadata: nature
            in:
              - "Bois"
              - "Forêt fermée de conifères"
              - "Forêt fermée de feuillus"
              - "Forêt fermée mixte"
              - "Forêt ouverte"
              - "Zone arborée"
        heightmap: ground
        place:
          - pattern:
              seed: forest-grass
              chance: 0.1
              place:
                structure:
                  - at: [0, 0, 1]
                    put: *forest-grass
          - *voxel-forest-ground
          - pattern:
              seed: forest-tree1
              chance: 0.01
              place: *forest-tree1
          - pattern:
              seed: tree2
              chance: 0.003
              place: *forest-tree2
      - type: renderSurfaces
        after: ground
        models:
          type: vegetation
          filter:
            metadata: nature
            equals:  "Haie"
        heightmap: ground
        place:
          - structure:
              at: [0, 0, 1..3]
              put:
                - pattern:
                    seed: haie
                    chance: 0.7
                    place: default:bush_leaves
                - pattern:
                    seed: haie
                    chance: 0.3
                    place: default:blueberry_bush_leaves
                - pattern:
                    seed: haie
                    chance: 0.05
                    place: default:blueberry_bush_leaves_with_berries
          - pattern:
              seed: haie
              chance: 0.003
              place: *forest-tree1

  populateWaterPresence:
    after: fetchWater
    type: copyHeightmap
    models:
      type: water
    from: 1
    to: water

  computeWaterDepth:
    after: populateWaterPresence
    type: copyHeightmap
    models:
      type: water
    from:
      remap:
        manhattan: water
        maximumDistance: 12
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 8
        3..3: 10
        4..6: 11
        7..12: 12
    to: water

  renderWater:
    after:
      - ground
      - computeWaterDepth
      # Vegetation and water vector data overlap in certain areas. (Because of vegetation representing canopy)
      # The dependency and air voxel below should be removed when cropping is implemented on vector data.
      - forest
    type: renderHeightmap
    minimum:
      sum:
        - ground
        - 1
        - product: [ -1, water ]
    maximum: ground
    place:
      structure:
        - put: *voxel-water
          at: [ 0, 0, 0 ]
        # This a dirt fix to remove vegetation on water
        - put: *voxel-air
          at: [ 0, 0, 1..12 ]

  path:
    after:
      - fetchRoads
      - ground
      - forest
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Chemin", "Sentier", "Roue empierrée" ]
    structure:
      - put: *path
        at: [ 0, -1..1, 0]
      - put: *voxel-air
        at: [ 0, -1..1, 1..2 ]

  renderBridges:
    after: path
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    renderOnlyWhenAbove:
      sum:
        - ground
        - 1
    structure:
      # Half bridge structure (sectional view)
      axes: [ z, y ]
      blueprint:
        - "▒▒         ▒▒"
        - "▒▒▒▒▒▒▒▒▒▒▒▒▒"
      with:
        "▒": *voxel-stone
      zOffset: -1

  renderRoadsPass1:
    after: renderBridges
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      # Road border lines and air to clean eventual voxels (sectional view)
      axes: [ z, y ]
      blueprint:
        - "·········"
        - "·········"
        - "█·······█"
      with:
        "█": *road-paint
        "·": *voxel-air

  renderRoadsPass2:
    after: renderRoadsPass1
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      # Road central line and tar (view from above)
      axes: [ x, y ]
      blueprint:
        - "░░░█░░░"
        - "░░░█░░░"
        - "░░░█░░░"
        - "░░░░░░░"
        - "░░░░░░░"
      with:
        "█": *road-paint
        "░": *road-tar

  agriculture:
    type: sequence
    after: [ground, forest]
    do:
      - type: fetchData
        modelType: fields
        provider:
          type: wfs
          url: https://data.geopf.fr/wfs/wfs
          features: RPG.LATEST:parcelles_graphiques
        processor:
          type: geoToolsVector
        postProcessing:
          - type: copy
            metadata: code_cultu
            to: crop
          - type: remap
            metadata: crop
              # Special values:
              # "none" is set for surfaces that won't be rendered (not a field).
              # "common" is set for all type of culture we don't want a specific rendering.
              # "unknown" is set for all unknown "code_cultu". Could be replaced later with "common".
            toFrom:
              none: [BFS, BOR, BTA, CSS, MRS, SNE, TCR]
              common: [ACP, AFG, CAC, CAG, CID, CIT, CML, CPL, CSA, LDH, LDP, LEC, LOT, LUZ, MCS, MLC, MLF, MLG, MLT, MOH, MPC, MSW, OAG, OHR, PAG, PHF, PHI, PHS, PPR, SAG, SHD, SOG, SRS, ZZZ]
              banana: [BCA, BEF]
              barley: [AVH, AVP, ORH, ORP]
              carot: [CAR]
              corn: [MID, MIS]
              cucumber: [CCN]
              flower: [HPC]
              hemp: [CHV, CSE]
              herb: [AAR, AME, ARP, GES, OEI, PME, PRF, SAI, SGE, TAB, VES, VNL]
              hop: [HBL]
              lavender: [LAV]
              linen: [LIF, LIH, LIP]
              meadow: [GRA, JAC, JNO, PPH, PTR, SIN, SNU, SPH, SPL, TRE]
              orchard: [AGR, ANA, CBT, CNA, CNE, OLI, PEP, PEV, PPP, PRU, PVT, PWT, SBO]
              potato: [PTC]
              rapeseed: [CZH, CZP]
              rice: [RIZ]
              rye: [SGH, SGP]
              soya: [SOJ]
              sunflower: [TRN]
              tomato: [TOM]
              trees: [CAE, CEE, CTG, NOS, NOX, TRU]
              vegetable: [AIL, ARA, ART, BTN, CEL, CHU, EPI, FEV, FLA, FLP, FNU, FRA, FVL, FVP, LBF, MDI, MLO, MOT, NVT, OIG, PCH, PFR, POR, POT, PSL, PVP, RDI, TBT]
              vine: [VRC, VRG]
              wheat: [BDH, BDP, BTH, BTP, CAH, EPE, MCR, TTH, TTP]
            default: unknown
      - type: schedule
        after: ground
        models:
          type: fields
        do:

# MISSING: A simple line renderer on a heightmap (for fences)
# MAYBE MISSING: A 2D line renderer + heightmap

          # Likely to be removed - display unknwown crops as "unknown" nodes
          unknown:
            type: renderSurfaces
            models:
              filter:
                metadata: crop
                equals: unknown
            heightmap: ground
            place: unknown:unknown

          # common -Generic undetermined field
          # also : barley, corn, oat, soya, rice, rye, wheat
          common:
            type: renderSurfaces
            models:
               filter:
                 metadata: crop
                 in: [common, barley, corn, oat, soya, rice, rye, wheat]
            heightmap: ground
            place:
              - default:dirt
              - structure:
                - at: [0, 0, 1]
                  put:
                    pattern:
                      repeatStructure:
                        - at: [0, 0, 0]
                          put: farming:wheat_8
                        - at: [0, 1, 0]
                          put:
                            pattern:
                              chance: 0.02
                              place: flowers:rose

          # vegetables - Generic vegetable field
          vegetable:
            type: renderSurfaces
            models:
               filter:
                 metadata: crop
                 in: [vegetable, carot, cucumber]
            heightmap: ground
            place:
              - default:dirt
              - structure:
                - at: [0, 0, 1]
                  put: default:fern_1

          # meadow - Meadows and like
          meadow:
            type: renderSurfaces
            models:
              filter:
                metadata: crop
                equals: meadow
            heightmap: ground
            place:
              - default:dirt_with_grass
              - structure:
                - at: [0, 0, 1]
                  put:
                    - pattern:
                        chance: 0.3
                        place: default:grass_5
                    - pattern:
                        chance: 0.25
                        place: default:grass_4
                    - pattern:
                        chance: 0.2
                        place: default:grass_3
                    - pattern:
                        chance: 0.15
                        place: default:grass_2
                    - pattern:
                        chance: 0.1
                        place: default:grass_1
                    - pattern:
                        chance: 0.01
                        place:
                          - flowers:mushroom_brown
                          - pattern:
                              seed: flower1
                              chance: 0.8
                              place: flowers:dandelion_yellow
                          - pattern:
                              seed: flower2
                              chance: 0.6
                              place: flowers:dandelion_white
                          - pattern:
                              seed: flower3
                              chance: 0.4
                              place: flowers:viola
                          - pattern:
                              seed: flower4
                              chance: 0.2
                              place: flowers:chrysanthemum_green

          # orchard - Fruit tree culture
          # also: banana, tree : all kind of tree culture
          orchard:
            type: renderSurfaces
            models:
              filter:
                metadata: crop
                in: [orchard, banana, trees]
            heightmap: ground
            place:
              - structure:
                  at: [0, 0, 1]
                  put:
                    - pattern:
                        chance: 0.2
                        place: default:grass_3
                    - pattern:
                        chance: 0.15
                        place: default:grass_2
                    - pattern:
                        chance: 0.1
                        place: default:grass_1
              - pattern:
                  repeatStructure:
                    - at: [0..8, 0..8, 0]
                      put: default:dirt_with_grass
                    - at: [0, 0, 0]
                      put: *apple-tree


          flowers:
            type: renderSurfaces
            models:
              filter:
                metadata: crop
                equals: flowers
            heightmap: ground
            place:
              - default:dirt_with_grass
              - structure:
                - at: [0, 0, 1]
                  put:
                    - pattern:
                        seed: flower1
                        chance: 0.6
                        place: flowers:flowers:geranium
                    - pattern:
                        seed: flower1
                        chance: 0.5
                        place: flowers:dandelion_yellow
                    - pattern:
                        seed: flower2
                        chance: 0.4
                        place: flowers:dandelion_white
                    - pattern:
                        seed: flower3
                        chance: 0.3
                        place: flowers:viola
                    - pattern:
                        seed: flower4
                        chance: 0.2
                        place: flowers:rose
                    - pattern:
                        seed: flower4
                        chance: 0.1
                        place: flowers:tulip

          #
          linen:
            type: renderSurfaces
            models:
              filter:
                metadata: crop
                equals: linen
            heightmap: ground
            place:
              - default:dirt
              - structure:
                - at: [0, 0, 1]
                  put:
                    pattern:
                      repeatStructure:
                        - at: [0, 0, 0]
                          put: flowers:geranium
                        - at: [0, 1, 0]
                          put:
                            pattern:
                              chance: 0.02
                              place: default:grass_1


          #
          corn:
            type: renderSurfaces
            models:
              filter:
                metadata: crop
                in: [corn, hemp]
            heightmap: ground
            place:
              - default:dirt
              - structure:
                - at: [0, 0, 1]
                  put:
                    pattern:
                      repeatStructure:
                        - at: [0, 0, 0]
                          put: default:junglegrass
                        - at: [1, 0, 0]
                          put:
                            pattern:
                              chance: 0.02
                              place: default:grass_1