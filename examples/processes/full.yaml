heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  altitude:
    type: sequence
    do:
    - type: fetchData
      modelType: altitude
      provider:
        type: wmsFloat
        url: https://data.geopf.fr/wms-r/wms
        layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
      processor:
        type: floatMatrix
    - type: sequence
      do:
        - type: noOperation
        - type: noOperation
        - type: noOperation
    - type: populateHeightmap
      models:
        type: altitude
      heightmap: ground
    - type: setSpawn
      heightmap:
        sum: [ground, 1]
      x: 0
      y: 0

  ground:
    after:
      - altitude
      - flattenWater
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]

  fetchBuildings:
    type: fetchData
    modelType: buildings
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    processor:
      type: geoToolsVector
    postProcessing:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: truncate
        metadata: height
        method: round
        ifMissing: ignore
      - type: default
        metadata: height
        value: 5
        as: integer

  fetchWater:
    type: fetchData
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique
    processor:
      type: geoToolsVector

  fetchRoads:
    type: fetchData
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route
    processor:
      type: geoToolsVector

  flattenWater:
    after:
      - fetchWater
      - altitude
    type: copyHeightmap
    models:
      type: water
    from:
      localMin: ground
      range: 9
    to: ground

  computeBuildingsAltitude:
    after:
      - fetchBuildings
      - ground
    type: computeHeightmapStats
    models:
      type: buildings
    heightmap: ground
    compute:
      minimum: minimum-ground-altitude
      maximum: ground-floor-altitude

  flattenGroundBuildings:
    after:
      - computeBuildingsAltitude
    type: fillBetweenHeightmapAndMetadata
    models:
      type: buildings
    heightmap: ground
    altitudeMetadata: ground-floor-altitude
    placeAbove: *voxel-empty
    placeBelow: *voxel-building-ground

  renderBuildings:
    after: flattenGroundBuildings
    type: renderBuildings
    models:
      type: buildings
      filter:
        metadata: height
        greaterThan: 0
    roof: *voxel-cobble
    wall: *voxel-stone
    window: *voxel-glass

  forest:
    type: sequence
    using: ground
    do:
      - type: fetchData
        modelType: vegetation
        provider:
          type: wfs
          url: https://data.geopf.fr/wfs/wfs
          features: BDTOPO_V3:zone_de_vegetation
        processor:
          type: geoToolsVector
      - type: renderSurfaces
        after: ground
        models:
          type: vegetation
          filter:
            metadata: nature
            in:
              - "Bois"
              - "Forêt fermée de conifères"
              - "Forêt fermée de feuillus"
              - "Forêt fermée mixte"
              - "Forêt ouverte"
              - "Zone arborée"
        heightmap: ground
        place:
          - pattern:
              seed: forest-grass
              chance: 0.1
              place:
                structure:
                  - at: [0, 0, 1]
                    put: *forest-grass
          - *voxel-forest-ground
          - pattern:
              seed: forest-tree1
              chance: 0.01
              place: *forest-tree1
          - pattern:
              seed: tree2
              chance: 0.003
              place: *forest-tree2

  populateWaterPresence:
    after: fetchWater
    type: copyHeightmap
    models:
      type: water
    from: 1
    to: water

  computeWaterDepth:
    after: populateWaterPresence
    type: copyHeightmap
    models:
      type: water
    from:
      remap:
        manhattan: water
        maximumDistance: 12
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 8
        3..3: 10
        4..6: 11
        7..12: 12
    to: water

  renderWater:
    after:
      - ground
      - computeWaterDepth
      # Vegetation and water vector data overlap in certain areas. (Because of vegetation representing canopy)
      # The dependency and air voxel below should be removed when cropping is implemented on vector data.
      - forest
    type: renderHeightmap
    minimum:
      sum:
        - ground
        - 1
        - product: [ -1, water ]
    maximum: ground
    place:
      structure:
        - put: *voxel-water
          at: [ 0, 0, 0 ]
        # This a dirt fix to remove vegetation on water
        - put: *voxel-air
          at: [ 0, 0, 1..12 ]

  path:
    after:
      - fetchRoads
      - ground
      - forest
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Chemin", "Sentier", "Roue empierrée" ]
    structure:
      - put: *path
        at: [ 0, -1..1, 0]
      - put: *voxel-air
        at: [ 0, -1..1, 1..2 ]

  renderBridges:
    after: path
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    renderOnlyWhenAbove:
      sum:
        - ground
        - 1
    structure:
      # Half bridge structure (sectional view)
      axes: [ z, y ]
      blueprint:
        - "▒▒         ▒▒"
        - "▒▒▒▒▒▒▒▒▒▒▒▒▒"
      with:
        "▒": *voxel-stone
      zOffset: -1

  renderRoadsPass1:
    after: renderBridges
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      # Road border lines and air to clean eventual voxels (sectional view)
      axes: [ z, y ]
      blueprint:
        - "·········"
        - "·········"
        - "█·······█"
      with:
        "█": *road-paint
        "·": *voxel-air

  renderRoadsPass2:
    after: renderRoadsPass1
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      # Road central line and tar (view from above)
      axes: [ x, y ]
      blueprint:
        - "░░░█░░░"
        - "░░░█░░░"
        - "░░░█░░░"
        - "░░░░░░░"
        - "░░░░░░░"
      with:
        "█": *road-paint
        "░": *road-tar

  agriculture:
    type: sequence
    after: [ground, forest]
    do:
      - type: fetchData
        modelType: fields
        provider:
          type: wfs
          url: https://data.geopf.fr/wfs/wfs
          features: RPG.LATEST:parcelles_graphiques
        processor:
          type: geoToolsVector
        # postProcessing:
        #   - type: copy
        #     metadata: code_cultu
        #     to: crop
        #   - type: remap
        #     metadata: crop
        #     toFrom:
        #       banana: [BCA, BCC, BCF, BCI, BCP, BCR, BEA, BEF, BEI, BEP, BER, Y1, Y2, YB]
        #       barley: [AVH, AVP, OH, OP, ORH, ORP]
        #       carot: [CAF, CAR, CB, CT]
        #       rapeseed: [CH, CP, CS, CZH, CZP]
        #       corn: [MA, MD, ME, MID, MIE, MIS, MS]
        #       cucumber: [CCN]
        #       flower: [AF, FB, FC, FN, GER, Y6, Y7]
        #       hemp: [C7, C8, CHV, CO, CSE, CU, CV, CW, CX, CY, CZ]
        #       lavender: [LA, LAV, LV]
        #       linen: [LIF, LIH, LIP, LJ, LM, LN, LO, LS, LT, LU, LW, LX, LY, LZ]
        #       market: [ART, AUB, EPI, FLA, FLP, FNO, FP, LC, LI, LSA, MC, MU, MV, MW, MX, MY, Y8, YG]
        #       meadow: [DH, DS, ES, F1, F2, F3, FA, FAG, FI, J5M, J6P, J6S, JA, JNO, NE, PAQ, PRL, PT, PTR, PX, RGA, SF, SPH, SPL, TR5, TR7, TR8, TRD, TRE]
        #       oat: [AH, AP, AV]
        #       orchard: [AD, AE, AM, BV, BW, CBT, CNA, CNE, CR, NS, NX, OA, OL, OLI, ON, PEP, PG, PK, PRU, PU, PVT, PWT, SBO, VC, VE, VGD]
        #       potato: [P1, P2, PE, PF, PTC, PTF]
        #       rice: [R1, R2, R3, R4, RIZ, RT, RZ]
        #       rye: [SE, SGH, SGP]
        #       soya: [SJ, SO, SOJ]
        #       sunflower: [TS]
        #       tomato: [TC, TM, TN, TOM, TOT, TT, TU]
        #       vegetable: [A1, AI, FG, HA, LG, MR, OC, P3, P7, P8, PB, PD, PJ, SC, SL]
        #       vine: [RE, RVI, VG, VI, VN, VRG, VRN, VRT, VT, VU, VV, VX, VY, VZ]
        #       wheat: [AS, BA, BB, BC, BD, BDH, BDP, BDT, BG, BH, BP, BTH, BTP, CGF, CGH, CGO, CGP, CGS, CHA, CHH, CHS, CHT, EP, EPE, ET, EX, MCR, SB]
      - type: schedule
        after: ground
        models:
          type: fields
        do:
          wheat:
            type: renderSurfaces
            models:
               type: none
  #            filter:
  #              metadata: crop
  #              in: [barley, corn, oat, soya, wheat]
            heightmap: ground
            place:
              - default:dirt
              - structure:
                - at: [0, 0, 1]
                  put:
                    pattern:
                      repeatStructure:
                        - at: [0, 0, 0]
                          put: farming:wheat_8
                        - at: [0, 1, 0]
                          put:
                            pattern:
                              chance: 0.02
                              place: flowers:rose

# MISSING: A simple line renderer on a heightmap (for fences)
# MAYBE MISSING: A 2D line renderer + heightmap

          meadow:
            type: renderSurfaces
            models:
              type: none
  #            filter:
  #              metadata: crop
  #              equals: meadow
            heightmap: ground
            place:
              - default:dirt_with_grass
              - structure:
                - at: [0, 0, 1]
                  put:
                    - pattern:
                        chance: 0.3
                        place: default:grass_5
                    - pattern:
                        chance: 0.25
                        place: default:grass_4
                    - pattern:
                        chance: 0.2
                        place: default:grass_3
                    - pattern:
                        chance: 0.15
                        place: default:grass_2
                    - pattern:
                        chance: 0.1
                        place: default:grass_1
                    - pattern:
                        chance: 0.01
                        place:
                          - flowers:mushroom_brown
                          - pattern:
                              seed: flower1
                              chance: 0.8
                              place: flowers:dandelion_yellow
                          - pattern:
                              seed: flower2
                              chance: 0.6
                              place: flowers:dandelion_white
                          - pattern:
                              seed: flower3
                              chance: 0.4
                              place: flowers:viola
                          - pattern:
                              seed: flower4
                              chance: 0.2
                              place: flowers:chrysanthemum_green

          linen:
            type: renderSurfaces
            models:
              type: none
  #            filter:
  #              metadata: crop
  #              in: [barley, corn, oat, soya, wheat]
            heightmap: ground
            place:
              - default:dirt
              - structure:
                - at: [0, 0, 1]
                  put:
                    pattern:
                      repeatStructure:
                        - at: [0, 0, 0]
                          put: flowers:geranium
                        - at: [0, 1, 0]
                          put:
                            pattern:
                              chance: 0.02
                              place: default:grass_1

          orchard:
            type: renderSurfaces
            models:
              type: none
  #            filter:
  #              metadata: crop
  #              in: [barley, corn, oat, soya, wheat]
            heightmap: ground
            place:
              - structure:
                  at: [0, 0, 1]
                  put:
                    - pattern:
                        chance: 0.2
                        place: default:grass_3
                    - pattern:
                        chance: 0.15
                        place: default:grass_2
                    - pattern:
                        chance: 0.1
                        place: default:grass_1
              - pattern:
                  repeatStructure:
                    - at: [0..8, 0..8, 0]
                      put: default:dirt_with_grass
                    - at: [0, 0, 0]
                      put: *apple-tree

          corn:
            type: renderSurfaces
            #models:
  #            filter:
  #              metadata: crop
  #              in: [barley, corn, oat, soya, wheat]
            heightmap: ground
            place:
              - default:dirt
              - structure:
                - at: [0, 0, 1]
                  put:
                    pattern:
                      repeatStructure:
                        - at: [0, 0, 0]
                          put: default:junglegrass
                        - at: [1, 0, 0]
                          put:
                            pattern:
                              chance: 0.02
                              place: default:grass_1