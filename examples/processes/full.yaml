heightmaps:
  ground:
    default: 0
  water:
    default: 0
sources:
  mnt:
    modelType: mnt
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix
  bati:
    modelType: building
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    processor:
      type: geoToolsVector
    postProcessing:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: default
        metadata: height
        value: 5
        as: integer
  vegetation:
    modelType: vegetation
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:zone_de_vegetation
    processor:
      type: geoToolsVector
  surfaceEau:
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique
    processor:
      type: geoToolsVector
renderers:
  altitude:
    after:
      - source:mnt
    type: matrixToHeightmap
    models:
      type: mnt
    heightmap: ground
  mntCorrection:
    after:
      - source:surfaceEau
      - renderer:altitude
    type: copyHeightmap
    models:
      type: water
    from:
      localMin: ground
      range: 9
    to: ground
  ground:
    after:
      - renderer:altitude
      - renderer:mntCorrection
    type: heightmapRenderer
    at: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]
  building-leveling:
    after:
      - source:bati
      - renderer:ground
    type: leveling
    models:
      type: building
    heightmap: ground
    filling: default:cobble
  building:
    after:
      - renderer:building-leveling
    type: building
    models:
      type: building
      filter:
        metadata: height
        greaterThan: 0
    heightmap: ground
    roof: *voxel-cobble
    wall: *voxel-stone
    window: *voxel-glass
  forest:
    after:
      - renderer:ground
      - source:vegetation
    type: vector
    models:
      type: vegetation
      filter:
        metadata: nature
        in:
          - "Bois"
          - "Forêt fermée de conifères"
          - "Forêt fermée de feuillus"
          - "Forêt fermée mixte"
          - "Forêt ouverte"
          - "Zone arborée"
    heightmap: ground
    place:
      - pattern:
          seed: forest-grass
          chance: 0.1
          place:
            structure:
              - at: [0, 0, 1]
                put: *forest-grass
      - *voxel-forest-ground
      - pattern:
          seed: forest-tree1
          chance: 0.01
          place: *forest-tree1
      - pattern:
          seed: tree2
          chance: 0.003
          place: *forest-tree2
  waterPresence:
    after:
      - source:surfaceEau
    type: copyHeightmap
    models:
      type: water
    from: 1
    to: water
  waterHeight:
    after:
      - renderer:waterPresence
    type: copyHeightmap
    models:
      type: water
    from:
      remap:
        manhattan: water
        maximumDistance: 12
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 8
        3..3: 10
        4..6: 11
        7..12: 12
    to: water
  waterRdr:
    after:
      - renderer:ground
      - renderer:waterHeight
      # Vegetation and water vector data overlap in certain areas. (Because of vegetation representing canopy)
      # The dependency and air voxel below should be removed when cropping is implemented on vector data.
      - renderer:forest
    type: heightmapRenderer
    minimum:
      sum:
        - ground
        - 1
        - product: [ -1, water ]
    maximum: ground
    place:
      structure:
        - put: *voxel-water
          at: [ 0, 0, 0 ]
        # This a dirt fix to remove vegetation on water
        - put: *voxel-air
          at: [ 0, 0, 1..12 ]
