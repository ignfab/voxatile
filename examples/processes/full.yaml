heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  fetchAltitude:
    type: fetchData
    modelType: altitude
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix

  fetchBuildings:
    type: fetchData
    modelType: buildings
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    processor:
      type: geoToolsVector
    postProcessing:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: truncate
        metadata: height
        method: round
        ifMissing: ignore
      - type: default
        metadata: height
        value: 5
        as: integer

  fetchVegetation:
    type: fetchData
    modelType: vegetation
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:zone_de_vegetation
    processor:
      type: geoToolsVector

  fetchWater:
    type: fetchData
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique
    processor:
      type: geoToolsVector

  fetchRoads:
    type: fetchData
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route
    processor:
      type: geoToolsVector

  setAltitude:
    after: fetchAltitude
    type: populateHeightmap
    models:
      type: altitude
    heightmap: ground

  setSpawn:
    after: setAltitude
    type: setSpawn
    heightmap:
      sum: [ground, 1]
    x: 0
    y: 0

  flattenWater:
    after:
      - fetchWater
      - setAltitude
    type: copyHeightmap
    models:
      type: water
    from:
      localMin: ground
      range: 9
    to: ground

  renderGround:
    after:
      - setAltitude
      - flattenWater
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]

  computeBuildingsAltitude:
    after:
      - fetchBuildings
      - renderGround
    type: computeHeightmapStats
    models:
      type: buildings
    heightmap: ground
    compute:
      minimum: minimum-ground-altitude
      maximum: ground-floor-altitude

  flattenGroundBuildings:
    after:
      - computeBuildingsAltitude
    type: fillBetweenHeightmapAndMetadata
    models:
      type: buildings
    heightmap: ground
    altitudeMetadata: ground-floor-altitude
    placeAbove: *voxel-empty
    placeBelow: *voxel-building-ground

  renderResidentialBuildings:
    after: flattenGroundBuildings
    type: renderFacade
    models:
      type: buildings
      filter:
        metadata: usage_1
        equals: Résidentiel
    height: height
    altitude: ground-floor-altitude
    references:
      - &corner-material default:desert_sandstone_block
      - &base-material default:sandstone
      - &other-material default:desert_stone
      - &borders-material default:desert_sandstone_block
      - &cornice-material default:desert_sandstone_block
      - &lintel-material default:sandstonebrick
      - &materials
          "-": *base-material
          "+": *other-material
          "O": *borders-material
          "*": default:glass
          "=": *lintel-material
          "|": default:fence_junglewood
    build:
      - along: x
        concatenate:
          # Left corner
          - &corner
            at: [ 0, 0, 0 ]
            put: *corner-material
            stretchX:
              at: 0
            stretchZ:
              at: 0
            priority: -1
          # TODO
          - along: z
            concatenate:
              # Ground floor
              - priority: 1
                along: x
                concatenate:
                  - atLeast: 0
                    along: x
                    repeat:
                      axes: [ z, x ]
                      blueprint: [ "-O==O", "-O**O", "-O**O", "-O**O", "-O==O", "-O--O" ]
                      with : *materials
                      stretchZ:
                        at: 0
                  # Door
                  - axes: [ z, x ]
                    blueprint: [ "-O==O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-" ]
                    with : *materials
                    stretchZ:
                      at: 0
                  # Right ground windows
                  - along: x
                    atLeast: 0
                    repeat:
                      axes: [ z, x ]
                      blueprint: [ "O==O-", "O**O-", "O**O-", "O**O-", "O==O-", "O--O-" ]
                      with: *materials
                      stretchZ:
                        at: 0
              # Cornice
              - at: [ 0, 0, 0 ]
                put: *cornice-material
                stretchX:
                  at: 0
              # Upper floors
              - priority: 2
                along: z
                atLeast: 0
                repeat:
                  along: x
                  concatenate:
                    - at: [ 0, 0, 0..5 ]
                      put: *other-material
                    - along: x
                      repeat:
                        axes: [ y, z, x ]
                        blueprint:
                          - [ "O==O+", "O**O+", "O**O+", "O**O+", "O==O+", "O--O+" ]
                          - [ "     ", "     ", "     ", "|||| ", "==== ", "O  O " ]
                        with : *materials
                        # TODO: En inversant la profondeur, on peut s'éviter beaucoup d'offset (a priori, les façade vont être plus souvent saillantes)
                        yOffset: -1
              # Upper cornice
              - at: [ 0, 0, 0 ]
                put: *cornice-material
                stretchX:
                  at: 0
                stretchZ:
                  at: 0
          # Right corner
          - *corner
      - at: [ 0, 0, 0 ]
        put: *base-material
        stretchX:
          at: 0
        stretchZ:
          at: 0

  renderOfficeBuildings:
    after: flattenGroundBuildings
    type: renderFacade
    models:
      type: buildings
      filter:
        not:
          metadata: usage_1
          equals: Résidentiel
    height: height
    altitude: ground-floor-altitude
    references:
      - &modern-wall default:clay
      - &modern-glass default:obsidian_glass
      - &modern-materials
          "O": *modern-wall
          "*": *modern-glass
    build:
      - along: x
        concatenate:
          # Left corner
          - put: *modern-wall
            at: [0, 0, 0]
            stretchX:
              at: 0
            stretchZ:
              at: 0
          # Facade
          - priority: 1
            along: z
            concatenate:
              # Ground floor
              - along: x
                concatenate:
                  # Left
                  - along: x
                    repeat:
                      with: *modern-materials
                      axes: [z, x]
                      blueprint: [ "O**", "O**", "O**", "OOO", "OOO"]
                  # Door
                  - with: *modern-materials
                    axes: [z, x]
                    blueprint: [ "OOOO", "O  O", "O  O", "O  O", "O  O" ]
                  # Right
                  - along: x
                    repeat:
                      with: *modern-materials
                      axes: [z, x]
                      blueprint: [ "**O", "**O", "**O", "OOO", "OOO" ]
              # Upper floors
              - priority: 1
                along: x
                concatenate:
                  - put: *modern-wall
                    at: [0, 0, 0 ]
                    stretchZ:
                      at: 0
                  - along: x
                    repeat:
                      with: *modern-materials
                      axes: x
                      blueprint: "**O"
                      stretchZ:
                        at: 0
              # Top
              - put: *modern-wall
                at: [0, 0, 0 ]
                stretchX:
                  at: 0
                stretchZ:
                  at: 0
          # Left corner
          - put: *modern-wall
            at: [0, 0, 0]
            stretchX:
              at: 0
            stretchZ:
              at: 0
      # Default
      - at: [ 0, 0, 0 ]
        put: *modern-wall
        stretchX:
          at: 0
        stretchZ:
          at: 0

  renderForest:
    after:
      - renderGround
      - fetchVegetation
    type: renderSurfaces
    models:
      type: vegetation
      filter:
        metadata: nature
        in:
          - "Bois"
          - "Forêt fermée de conifères"
          - "Forêt fermée de feuillus"
          - "Forêt fermée mixte"
          - "Forêt ouverte"
          - "Zone arborée"
    heightmap: ground
    place:
      - pattern:
          seed: forest-grass
          chance: 0.1
          place:
            structure:
              - at: [0, 0, 1]
                put: *forest-grass
      - *voxel-forest-ground
      - pattern:
          seed: forest-tree1
          chance: 0.01
          place: *forest-tree1
      - pattern:
          seed: tree2
          chance: 0.003
          place: *forest-tree2

  populateWaterPresence:
    after: fetchWater
    type: copyHeightmap
    models:
      type: water
    from: 1
    to: water

  computeWaterDepth:
    after: populateWaterPresence
    type: copyHeightmap
    models:
      type: water
    from:
      remap:
        manhattan: water
        maximumDistance: 12
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 8
        3..3: 10
        4..6: 11
        7..12: 12
    to: water

  renderWater:
    after:
      - renderGround
      - computeWaterDepth
      # Vegetation and water vector data overlap in certain areas. (Because of vegetation representing canopy)
      # The dependency and air voxel below should be removed when cropping is implemented on vector data.
      - renderForest
    type: renderHeightmap
    minimum:
      sum:
        - ground
        - 1
        - product: [ -1, water ]
    maximum: ground
    place:
      structure:
        - put: *voxel-water
          at: [ 0, 0, 0 ]
        # This a dirt fix to remove vegetation on water
        - put: *voxel-air
          at: [ 0, 0, 1..12 ]

  path:
    after:
      - fetchRoads
      - renderGround
      - renderForest
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Chemin", "Sentier", "Route empierrée" ]
    structure:
      - put: *path
        at: [ 0, -1..1, 0]
      - put: *voxel-air
        at: [ 0, -1..1, 1..2 ]

  renderBridges:
    after: path
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    renderOnlyWhenAbove:
      sum:
        - ground
        - 1
    structure:
      # Half bridge structure (sectional view)
      axes: [ z, y ]
      blueprint:
        - "▒▒         ▒▒"
        - "▒▒▒▒▒▒▒▒▒▒▒▒▒"
      with:
        "▒": *voxel-stone
      zOffset: -1

  renderRoadsPass1:
    after: renderBridges
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      # Road border lines and air to clean eventual voxels (sectional view)
      axes: [ z, y ]
      blueprint:
        - "·········"
        - "·········"
        - "█·······█"
      with:
        "█": *road-paint
        "·": *voxel-air

  renderRoadsPass2:
    after: renderRoadsPass1
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      # Road central line and tar (view from above)
      axes: [ x, y ]
      blueprint:
        - "░░░█░░░"
        - "░░░█░░░"
        - "░░░█░░░"
        - "░░░░░░░"
        - "░░░░░░░"
      with:
        "█": *road-paint
        "░": *road-tar
