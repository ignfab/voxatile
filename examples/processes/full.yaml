heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  altitude:
    type: sequence
    do:
    - type: fetchData
      modelType: altitude
      provider:
        type: wmsFloat
        url: https://data.geopf.fr/wms-r/wms
        layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    - type: populateHeightmap
      models:
        type: altitude
      heightmap: ground
    - type: setSpawn
      heightmap:
        sum: [ground, 1]
      x: 0
      y: 0

  fetchBuildings:
    type: fetchData
    modelType: buildings
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:batiment
      maxFeaturesPerQuery: 500
    postProcessing:
      - type: copy
        metadata: hauteur
        to: height
      - type: parse
        metadata: height
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: truncate
        metadata: height
        method: round
        ifMissing: ignore
      - type: default
        metadata: height
        value: 5
        as: integer

  fetchWater:
    type: fetchData
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique

  fetchRoads:
    type: fetchData
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route

  flattenWater:
    after:
      - fetchWater
      - altitude
    type: copyHeightmap
    models:
      type: water
    from:
      localMin: ground
      range: 9
    to: ground

  renderGround:
    after:
      - altitude
      - flattenWater
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]

  computeBuildingsAltitude:
    after:
      - fetchBuildings
      - renderGround
    type: computeHeightmapStats
    models:
      type: buildings
    heightmap: ground
    compute:
      minimum: minimum-ground-altitude
      maximum: ground-floor-altitude

  flattenGroundBuildings:
    after:
      - computeBuildingsAltitude
    type: fillBetweenHeightmapAndMetadata
    models:
      type: buildings
    heightmap: ground
    altitudeMetadata: ground-floor-altitude
    placeAbove: *voxel-air
    placeBelow: *voxel-building-ground

  # Hacky way to render roofs. Should be removed.
  # Would have been nice to have a fillBetweenMetadatas
  renderRoofs:
    after: flattenGroundBuildings
    type: renderBuildings
    models:
      type: buildings
      filter:
        metadata: height
        greaterThan: 0
    roof: *voxel-cobble
    wall: *voxel-air
    window: *voxel-air

  forest:
    type: sequence
    using: renderGround
    do:
      - type: fetchData
        modelType: vegetation
        provider:
          type: wfs
          url: https://data.geopf.fr/wfs/wfs
          features: BDTOPO_V3:zone_de_vegetation
      - type: renderSurfaces
        after: renderGround
        models:
          type: vegetation
          filter:
            metadata: nature
            in:
              - "Bois"
              - "Forêt fermée de conifères"
              - "Forêt fermée de feuillus"
              - "Forêt fermée mixte"
              - "Forêt ouverte"
              - "Zone arborée"
        heightmap: ground
        place:
          - pattern:
              seed: forest-grass
              chance: 0.1
              place:
                structure:
                  - at: [0, 0, 1]
                    put: *forest-grass
          - *voxel-forest-ground
          - pattern:
              seed: forest-tree1
              chance: 0.01
              place: *forest-tree1
          - pattern:
              seed: tree2
              chance: 0.003
              place: *forest-tree2

  populateWaterPresence:
    after: fetchWater
    type: copyHeightmap
    models:
      type: water
    from: 1
    to: water

  computeWaterDepth:
    after: populateWaterPresence
    type: copyHeightmap
    models:
      type: water
    from:
      remap:
        manhattan: water
        maximumDistance: 12
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 8
        3..3: 10
        4..6: 11
        7..12: 12
    to: water

  renderWater:
    after:
      - renderGround
      - computeWaterDepth
      # Vegetation and water vector data overlap in certain areas. (Because of vegetation representing canopy)
      # The dependency and air voxel below should be removed when cropping is implemented on vector data.
      - forest
    type: renderHeightmap
    minimum:
      sum:
        - ground
        - 1
        - product: [ -1, water ]
    maximum: ground
    place:
      structure:
        - put: *voxel-water
          at: [ 0, 0, 0 ]
        # This a dirt fix to remove vegetation on water
        - put: *voxel-air
          at: [ 0, 0, 1..12 ]

  path:
    after:
      - fetchRoads
      - renderGround
      - forest
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Chemin", "Sentier", "Route empierrée" ]
    structure:
      - put: *path
        at: [ 0, -1..1, 0]
      - put: *voxel-air
        at: [ 0, -1..1, 1..2 ]

  renderBridges:
    after: path
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    renderOnlyWhenAbove:
      sum:
        - ground
        - 1
    structure:
      # Half bridge structure (sectional view)
      axes: [ z, y ]
      blueprint:
        - "▒▒         ▒▒"
        - "▒▒▒▒▒▒▒▒▒▒▒▒▒"
      with:
        "▒": *voxel-stone
      zOffset: -1

  renderRoadsPass1:
    after: renderBridges
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      # Road border lines and air to clean eventual voxels (sectional view)
      axes: [ z, y ]
      blueprint:
        - "·········"
        - "·········"
        - "█·······█"
      with:
        "█": *road-paint
        "·": *voxel-air

  renderRoadsPass2:
    after: renderRoadsPass1
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      # Road central line and tar (view from above)
      axes: [ x, y ]
      blueprint:
        - "░░░█░░░"
        - "░░░█░░░"
        - "░░░█░░░"
        - "░░░░░░░"
        - "░░░░░░░"
      with:
        "█": *road-paint
        "░": *road-tar

  renderResidentialBuildings:
    after:
      - flattenGroundBuildings
      - renderRoofs
    type: renderFacade
    models:
      type: buildings
      filter:
        metadata: usage_1
        equals: Résidentiel
    height: height
    altitude: ground-floor-altitude
    # TODO: Layout should probably be defined on a common.yaml file in format.
    build:
     - along: x
       concatenate:
         # Left corner
         - &corner
           structure:
             at: [ 0, -1..0, 0 ]
             put: *corner-material
           stretchableAlongX:
             at: 0
           stretchableAlongZ:
             at: 0
           priority: -1
         - along: z
           concatenate:
             # Ground floor
             - priority: 1
               along: x
               concatenate:
                 - atLeast: 0
                   along: x
                   repeat:
                     structure:
                       axes: [ z, x ]
                       blueprint: [ "-O==O", "-O**O", "-O**O", "-O**O", "-O==O", "-O--O" ]
                       with: *facade-residential-materials
                     stretchableAlongZ:
                       at: 0
                 # Door
                 - structure:
                     axes: [ z, x ]
                     blueprint: [ "-O==O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-" ]
                     with: *facade-residential-materials
                   stretchableAlongZ:
                     at: 0
                 # Right ground windows
                 - along: x
                   atLeast: 0
                   repeat:
                     structure:
                       axes: [ z, x ]
                       blueprint: [ "O==O-", "O**O-", "O**O-", "O**O-", "O==O-", "O--O-" ]
                       with: *facade-residential-materials
                     stretchableAlongZ:
                       at: 0
             # Cornice
             - structure:
                 at: [ 0, 0, 0 ]
                 put: *cornice-material
               stretchableAlongX:
                 at: 0
             # Upper floors
             - priority: 2
               along: z
               atLeast: 0
               repeat:
                 along: x
                 concatenate:
                   - structure:
                       at: [ 0, 0, 0..5 ]
                       put: *other-material
                   - along: x
                     repeat:
                       structure:
                         axes: [ y, z, x ]
                         blueprint:
                           - [ "O==O+", "O**O+", "O**O+", "O**O+", "O==O+", "O--O+" ]
                           - [ "     ", "     ", "     ", "|||| ", "==== ", "O  O " ]
                         with: *facade-residential-materials
                         yOffset: -1
             # Upper cornice
             - structure:
                 at: [ 0, 0, 0 ]
                 put: *cornice-material
               stretchableAlongX:
                 at: 0
               stretchableAlongZ:
                 at: 0
         # Right corner
         - *corner
     - structure:
         at: [ 0, 0, 0 ]
         put: *corner-material
       stretchableAlongX:
         at: 0
       stretchableAlongZ:
         at: 0

  renderOfficeBuildings:
    after:
      - flattenGroundBuildings
      - renderRoofs
    type: renderFacade
    models:
      type: buildings
      filter:
        not:
          metadata: usage_1
          equals: Résidentiel
    height: height
    altitude: ground-floor-altitude
    # TODO: Layout should probably be defined on a common.yaml file in format.
    build:
      - along: x
        concatenate:
          # Left corner
          - structure:
              put: *modern-wall
              at: [0, 0, 0]
            stretchableAlongX:
              at: 0
            stretchableAlongZ:
              at: 0
          # Facade
          - priority: 1
            along: z
            concatenate:
              # Ground floor
              - along: x
                concatenate:
                  # Left
                  - along: x
                    repeat:
                      structure:
                        with: *modern-materials
                        axes: [z, x]
                        blueprint: [ "O**", "O**", "O**", "OOO", "OOO"]
                  # Door
                  - structure:
                      with: *modern-materials
                      axes: [z, x]
                      blueprint: [ "OOOO", "O  O", "O  O", "O  O", "O  O" ]
                  # Right
                  - along: x
                    repeat:
                      structure:
                        with: *modern-materials
                        axes: [z, x]
                        blueprint: [ "**O", "**O", "**O", "OOO", "OOO" ]
              # Upper floors
              - priority: 1
                along: x
                concatenate:
                  - structure:
                      put: *modern-wall
                      at: [0, 0, 0 ]
                    stretchableAlongZ:
                      at: 0
                  - along: x
                    repeat:
                      structure:
                        with: *modern-materials
                        axes: x
                        blueprint: "**O"
                      stretchableAlongZ:
                        at: 0
              # Top
              - structure:
                  put: *modern-wall
                  at: [0, 0, 0 ]
                stretchableAlongX:
                  at: 0
                stretchableAlongZ:
                  at: 0
          # Left corner
          - structure:
              put: *modern-wall
              at: [0, 0, 0]
            stretchableAlongX:
              at: 0
            stretchableAlongZ:
              at: 0
      # Default
      - structure:
          at: [ 0, 0, 0 ]
          put: *modern-wall
        stretchableAlongX:
          at: 0
        stretchableAlongZ:
          at: 0
