#
# OME2 (Open Maps for Europe 2) data configuration.
#
# This configuration uses European geographic data to generate voxel terrain,
# including ground elevation, water features and road networks.
#
# Data is retrieved from GeoTIFF and WFS sources, then processed and rendered
# into the voxel world.
#
# Data specification:
#   https://ome-download-data.s3.eu-west-1.amazonaws.com/hvlsp/documents/OME2_HVLSP_v3.2_Data_specifications.pdf
#

heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  altitude:
    type: sequence
    models:
      type: altitude
    do:
    - type: fetchData
      modelType: altitude
      provider:
        type: geotiff
        filePath: data/eurodem.tif
    - type: populateHeightmap
      heightmap: ground
    - type: setSpawn
      heightmap:
        sum: [ground, 1]
      x: 0
      y: 0
    - type: renderHeightmap
      at: ground
      place:
        structure:
          - place: *voxel-grass
            at: [0, 0, 0]
          - place: *voxel-dirt
            at: [0, 0, -3..-1]
          - place: *voxel-stone
            at: [0, 0, -20..-4]

  water:
    after: altitude
    type: sequence
    models:
      type: water
    do:
    # A natural or man-made flowing watercourse or stream
    - type: fetchData
      modelType: water
      provider:
        type: wfs
        url: https://www.mapsforeurope.org/maps/wfs
        features: ome:hvlsp_wfs_hy_watercourse
        token: ImV1cm9nZW9ncmFwaGljc19yZWdpc3RlcmVkXzgyMzc5OCI.HS1Sgg._s2SSfxvXP88IxKhKBL6zz5Y1Do
      retry: 3
    # A segment of a watercourse within a hydrographic network.
    - type: fetchData
      modelType: water
      provider:
        type: wfs
        url: https://www.mapsforeurope.org/maps/wfs
        features: ome:hvlsp_wfs_hy_watercourse_link
        token: ImV1cm9nZW9ncmFwaGljc19yZWdpc3RlcmVkXzgyMzc5OCI.HS1Sgg._s2SSfxvXP88IxKhKBL6zz5Y1Do
      retry: 3
    # A natural or man-made flowing watercourse or stream
    - type: fetchData
      modelType: water
      provider:
        type: wfs
        url: https://www.mapsforeurope.org/maps/wfs
        features: ome:hvlsp_wfs_hy_watercourse_area
        token: ImV1cm9nZW9ncmFwaGljc19yZWdpc3RlcmVkXzgyMzc5OCI.HS1Sgg._s2SSfxvXP88IxKhKBL6zz5Y1Do
      retry: 3
    - type: copyHeightmap
      from:
        localMin: ground
        range: 9
      to: ground
    - type: copyHeightmap
      from: 1
      to: water
    # Depth grows with the distance from the bank.
    - type: copyHeightmap
      from:
        remap:
          manhattan: water
        mapping:
          0: 0
          1: 1
          2: 2
          3..3: 3
          4..6: 4
          7..10: 5
      to: water
    - type: renderHeightmap
      minimum:
        sum:
          - ground
          - 1
          - product: [-1, water]
      maximum:
        sum:
          - ground
          - -1
      place:
        structure:
          - place: *voxel-water
            at: [ 0, 0, 0 ]
          # This a dirt fix to remove vegetation on water
          - place: *voxel-air
            at: [ 0, 0, 1..12 ]

  road:
    after: altitude
    type: sequence
    models:
      type: road
    do:
    # Road links can represent paths, bicycle roads,
    # single carriageways, multiple carriageway roads and even fictitious trajectories across
    # traffic squares.
    - type: fetchData
      modelType: road
      provider:
        type: wfs
        url: https://www.mapsforeurope.org/maps/wfs
        features: ome:hvlsp_wfs_tn_road_link
        token: ImV1cm9nZW9ncmFwaGljc19yZWdpc3RlcmVkXzgyMzc5OCI.HS1Sgg._s2SSfxvXP88IxKhKBL6zz5Y1Do
      retry: 3
    # A road is a group of road_link objects that share the same national road code, 
    # European route number, or road name (if available).
    - type: fetchData
      modelType: road
      provider:
        type: wfs
        url: https://www.mapsforeurope.org/maps/wfs
        features: ome:hvlsp_wfs_tn_road
        token: ImV1cm9nZW9ncmFwaGljc19yZWdpc3RlcmVkXzgyMzc5OCI.HS1Sgg._s2SSfxvXP88IxKhKBL6zz5Y1Do
      retry: 3
    - type: renderLines2d
      structure:
        # Road border lines and air to clean eventual voxels (sectional view)
        axes: [ z, y ]
        blueprint:
          - "·········"
          - "·········"
          - "█·······█"
        with:
          "█": *road-paint
          "·": *voxel-air
      heightmap: ground
    - type: renderLines2d
      structure:
        # Road central line and tar (view from above)
        axes: [ x, y ]
        blueprint:
          - "░░░█░░░"
          - "░░░█░░░"
          - "░░░█░░░"
          - "░░░░░░░"
          - "░░░░░░░"
        with:
          "█": *road-paint
          "░": *road-tar
      heightmap: ground
