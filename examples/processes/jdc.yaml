heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  # Altitude

  fetchAltitude:
    type: fetchData
    modelType: altitude
    provider:
      type: wmsFloat
      url: https://data.geopf.fr/wms-r/wms
      layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    processor:
      type: floatMatrix

  setAltitude:
    after: fetchAltitude
    type: populateHeightmap
    models:
      type: altitude
    heightmap: ground

  # Conveniance task telling altitudes are known
  altitude:
    type: noOperation
    after: setAltitude

  setSpawn:
    after: setAltitude
    type: setSpawn
    heightmap:
      sum: [ground, 1]
    x: 0
    y: 0

  # Ground

  renderGround:
    after:
      - setAltitude
      - flattenWater
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *underground
          at: [0, 0, -20..0]

  fetchZoneActivite:
    type: fetchData
    modelType: zoneActivite
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:zone_d_activite_ou_d_interet
    processor:
      type: geoToolsVector

  renderSquareGround:
    after:
      - fetchZoneActivite
      - renderGround
    type: renderSurfaces
    models:
      type: zoneActivite
      filter:
        metadata: nature_detaillee
        # TODO: Maybe a case insensitive equals / in ?
        equals: Square
    heightmap: ground
    place:
      structure:
        - at: [0, 0, 0]
          put: *grass
        - at: [0, 0, 1]
          put:
            pattern:
              onlyInsteadOf: air
              place: *grass-decoration

  fetchGrass:
    type: fetchData
    modelType: grass
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: grass
    processor:
      type: geoToolsVector

  renderGrassGround:
    after:
      - fetchGrass
      - renderGround
    type: renderSurfaces
    models:
      type: grass
    heightmap: ground
    place:
      structure:
        - at: [0, 0, 0]
          put: *grass
        - at: [0, 0, 1]
          put:
            pattern:
              onlyInsteadOf: air
              place: *grass-decoration

  # Conveniance task telling ground is builtn
  ground:
    type: noOperation
    after:
     - renderSquareGround
     - renderGrassGround

  # Water

  fetchWater:
    type: fetchData
    modelType: water
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:surface_hydrographique
    processor:
      type: geoToolsVector

  flattenWater:
    after:
      - fetchWater
      - altitude
    type: copyHeightmap
    models:
      type: water
    from:
      localMin: ground
      range: 9
    to: ground

  populateWaterPresence:
    after: fetchWater
    type: copyHeightmap
    models:
      type: water
    from: 1
    to: water

  computeWaterDepth:
    after: populateWaterPresence
    type: copyHeightmap
    models:
      type: water
    from:
      remap:
        manhattan: water
        maximumDistance: 12
        targetValue: 0
      mapping:
        0: 0
        1: 1
        2: 3
        3..4: 4
        5..6: 5
        7..11: 6
        12: 7
    to: water

  renderWater:
    after:
      - ground
      - computeWaterDepth
    type: renderHeightmap
    minimum:
      sum:
        - ground
        - 1
        - product: [ -1, water ]
    maximum: ground
    place:
      structure:
        - put: *water
          at: [ 0, 0, 0 ]
        # This a dirt fix to remove vegetation on water
        - put: *air
          at: [ 0, 0, 1..12 ]

  # Buildings 3d

  fetchBatiCity:
    type: fetchData
    modelType: building-city
    provider:
      type: cityjson
      filePath: data/bati-jdc.city.json
    processor:
      type: cityjsonBuilding

  renderBati3dGround:
    after:
      - fetchBatiCity
      - ground
    type: renderBuildings3d
    models:
      type: building-city
    surfaceType: ground
    place: *buildings-ground

  renderBati3dWallsOther:
    after: renderBati3dGround
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        not:
          or:
            - metadata: nature
              in: [ "Chapelle", "Eglise" ]
            - metadata: usage_1
              in: [ "Résidentiel", "Commercial et services" ]
    surfaceType: wall
    place: *buildings-walls-default

  renderBati3dWallsReligieux:
    after: renderBati3dGround
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: nature
        in: [ "Chapelle", "Eglise" ]
    surfaceType: wall
    place: *buildings-walls-church

  renderBati3dWallsResidentiel:
    after: renderBati3dGround
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: usage_1
        equals: "Résidentiel"
    surfaceType: wall
    place: *buildings-walls-residential

  renderBati3dWallsCommercialServices:
    after: renderBati3dGround
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: usage_1
        equals: "Commercial et services"
    surfaceType: wall
    place: *buildings-walls-commercial

  bati3dWalls:
    type: noOperation
    after:
      - renderBati3dWallsOther
      - renderBati3dWallsReligieux
      - renderBati3dWallsResidentiel
      - renderBati3dWallsCommercialServices

  renderBati3dRoofsOther:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        not:
          or:
          - metadata: materiaux_de_la_toiture
            in: [ "3", "03", "30", "33", "13", "31", "12", "21", "2", "02", "20", "22", "4", "04", "44", "40" ]
          - metadata: nature
            in: [ "Chapelle", "Eglise" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buidlings-roof-default

  renderBati3dRoofsZinc:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "3", "03", "30", "33" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buidlings-roof-zinc

  renderBati3dRoofsZincTile:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "13", "31" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buidlings-roof-zinc-tiles

  renderBati3dRoofsChapelleEglise:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: nature
        in: [ "Chapelle", "Eglise" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buidlings-roof-church

  renderBati3dRoofsSlatesTile:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "12", "21" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buidlings-roof-slates-tiles

  renderBati3dRoofsSlates:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "2", "02", "20", "22" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buidlings-roof-slates

  renderBati3dRoofsConcrete:
    after: bati3dWalls
    type: renderBuildings3d
    models:
      type: building-city
      filter:
        metadata: materiaux_de_la_toiture
        in: [ "4", "04", "40", "44" ]
    surfaceType: roof
    place:
      structure:
        at: [0, 0, 0..1] # 2 block to wipe overstepping walls
        put: *buidlings-roof-concrete

  # Roads & paths

  fetchRoads:
    type: fetchData
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route
    processor:
      type: geoToolsVector
    postProcessing:
      - type: copy
        metadata: largeur_de_chaussee
        to: width
      - type: parse
        metadata: width
        as: decimal
        ifMissing: ignore
        ifNotParsable: removeMetadata
      - type: default
        metadata: width
        value: 7
        as: integer
      - type: conditional
        if:
          metadata: width
          lowerThan: 6
        then: # Stupid way to replace value...
        # TODO: Missing either "min/max" operator and/or "set" operation
          - type: default
            metadata: width-hack
            value: 6
            as: integer
          - type: copy
            metadata: width-hack
            to: width

  fetchCrosswalks:
    type: fetchData
    modelType: crosswalks
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: crosswalks
    processor:
      type: geoToolsVector

  path:
    after:
      - fetchRoads
      - renderWater
      - ground
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Chemin", "Sentier", "Roue empierrée" ]
    stickToHeightmap: ground
    structure:
      - put: *path
        at: [ 0, -1..1, 0]
      - put: *air
        at: [ 0, -1..1, 1..2 ]

  renderRoadsSidewalks:
    after:
      - fetchRoads
      - renderWater
      - ground
    type: renderDynamicLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    width:
      round: width
    repeated:
      put: nothing
      at: [0, 0, -2..0]
    extra:
      - put: *sidewalk
        at: [0, 0, 0]
      - put: *sidewalk-bed
        at: [0, 0, -2..-1]
    updateHeightmap: ground

  renderRoads:
    after:
      - renderRoadsSidewalks
    type: renderDynamicLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    width:
      round: width
    repeated:
      - put: *air
        at: [ 0, 0, 1 ]
      - put: *road-tar
        at: [ 0, 0, 0 ]
      - put: *road-bed
        at: [ 0, 0, -2..-1 ]
    updateHeightmap: ground

  roads:
    type: noOperation
    after:
      - renderRoads

  renderRoadsLines:
    after:
      - renderRoads
    type: renderLines
    models:
      type: road
      filter:
        metadata: nature
        in: [ "Bretelle", "Rond-point", "Route à 1 chaussée", "Route à 2 chaussées", "Type autoroutier"]
    structure:
      axes: [ x ]
      blueprint: "   ███"
      with:
        "█": *road-paint

  renderRoadsCrosswalksWipe:
    after:
      - renderRoadsLines
      - fetchCrosswalks
    type: renderLines
    models:
      type: crosswalks
    stickToHeightmap: ground
    structure:
      axes: [ y, x ]
      blueprint:
        - "----"
        - "----"
        - "----"
        - "----"
        - "----"
        - "----"
      with:
        "-":
          pattern:
            place: *road-tar
            onlyInsteadOf: *road-paint

  renderRoadsCrosswalks:
    after: renderRoadsCrosswalksWipe
    type: renderLines
    models:
      type: crosswalks
    stickToHeightmap: ground
    structure:
      axes: [ y, x ]
      blueprint:
        - "  ██"
        - "  ██"
        - "  ██"
        - "  ██"
      with:
        "█":
          pattern:
            place: *road-paint
            onlyInsteadOf: *road-tar

  # Trees Lidar + OSM

  fetchTrees:
    type: fetchData
    modelType: trees
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: trees
    processor:
      type: geoToolsVector

  fetchLidar:
    type: fetchData
    modelType: lidarhd
    provider:
      type: lasTiled
      tilesPath: data/lidar
      tilesFilenameTemplate: LHD_FXX_%04d_%04d_PTS_LAMB93_IGN69.copc.laz
      tileSize: 1000
      tileOffsetY: 1000
    processor:
      type: lasMerged

  renderVegetation:
    after: fetchLidar
    type: renderVoxels
    models:
      type: lidarhd
      filter:
        metadata: classification
        in: [ 3, 4, 5 ]
        as: integer
    place:
      structure:
        at: [0..1, 0..1, 0..1]
        put:
          pattern:
            onlyInsteadOf: *air
            place:
              pattern:
                chance: 0.4
                place: *tree-leaves

  findHighestLeaves:
    after:
      - fetchTrees
      - renderVegetation
    type: findVoxels
    models:
      type: trees
    only: *tree-leaves-list
    find:
      average: average-leaves

  renderTrunks:
    after: findHighestLeaves
    type: fillBetweenHeightmapAndValue
    models:
      type: trees
    heightmap: ground
    altitudeValue:
      sum: [ average-leaves, -1 ]
    placeBelow: *tree-trunk

  renderFakeTreeCrown:
    after: renderTrunks
    type: renderSurfaces
    models:
      type: trees
    altitude:
      sum: [ average-leaves, -1 ]
    place:
      structure:
        axes: [ z, x, y ]
        with:
          $:
            pattern:
              onlyInsteadOf: *air
              place:
                pattern:
                  chance: 0.6
                  place: *tree-leaves
        blueprint:
          - - "     "
            - "  $  "
            - " $$$ "
            - "  $  "
            - "     "
          - - " $$$ "
            - "$$$$$"
            - "$$$$$"
            - "$$$$$"
            - " $$$ "
          - - " $$$ "
            - "$$$$$"
            - "$$ $$"
            - "$$$$$"
            - " $$$ "
          - - " $$$ "
            - "$$$$$"
            - "$$ $$"
            - "$$$$$"
            - " $$$ "
          - - "     "
            - "  $  "
            - " $ $ "
            - "  $  "
            - "     "
        xOffset: -2
        yOffset: -2
        zOffset: -2

  # Metro stations

  fetchMetroStations:
    type: fetchData
    modelType: metro
    provider:
      type: gpkg
      filePath: data/metro.gpkg
      typeName: metro-parkings
    processor:
      type: geoToolsVector

  computeMetroStationsAltitude:
    after:
      - fetchMetroStations
      - altitude
    type: computeHeightmapStats
    models:
      type: metro
    heightmap: ground
    compute:
      maximum: surface-altitude

  renderMetroStationsSteps:
    after:
      - fetchMetroStations
    type: renderSurfaces
    heightmap: ground
    models:
      type: metro
    place: *metro-station-steps

  # Here, altitude is raised at maximum entrance level so decoration will be placed at that level.
  # It would be better to limit that to entrance walls but we don't have appropriate task yet.
  updateGroundWithMetroStation:
    after:
      - altitude
      - renderMetroStationsSteps
    type: setHeightmap
    set: surface-altitude
    to: ground
    models:
      type: metro

  renderMetroStationsWalls:
    after:
      - renderMetroStationsSteps
      - updateGroundWithMetroStation
    type: renderLines
    models:
      type: metro
    structure:
      - at: [0..1, 0..1, 0]
        put: *metro-station-walls-top
      - at: [0..1, 0..1, -10..-1]
        put: *metro-station-walls
    stickToAltitude: surface-altitude

  metroStations:
    type: noOperation
    after:
      - updateGroundWithMetroStation
      - renderMetroStationsWalls
      - renderMetroStationsSteps

  # Fences

  fetchFences:
    type: fetchData
    modelType: fences
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: fences
    processor:
      type: geoToolsVector

  renderFences:
    after:
      - fetchFences
      - ground
      - metroStations
    type: renderLines
    models:
      type: fences
      filter:
        metadata: barrier
        equals: fence
    structure: *fence-structure
    stickToHeightmap: ground

  # Benches

  fetchBenches:
    type: fetchData
    modelType: benches
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: benches
    processor:
      type: geoToolsVector

  renderBenches:
    after:
      - fetchBenches
      - ground
    type: renderSurfaces
    models:
      type: benches
    place: *bench
    heightmap: ground

  fetchBenchesLinear:
    type: fetchData
    modelType: benches_linear
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: benches_linear
    processor:
      type: geoToolsVector

  renderBenchesLinear:
    after:
      - fetchBenchesLinear
      - ground
    type: renderLines
    models:
      type: benches_linear
    structure: *liner-bench-structure
    stickToHeightmap: ground

  # Traffic lights
  # https://www.data.gouv.fr/datasets/signalisation-lumineuse-tricolore/

  fetchTrafficLights:
    type: fetchData
    modelType: traffic_lights
    provider:
      type: shapefile
      filePath: data/signalisation-tricolore.shp
    processor:
      type: geoToolsVector

  renderTrafficLights:
    after:
      - fetchTrafficLights
      - roads
    type: renderSurfaces
    models:
      type: traffic_lights
    heightmap: ground
    place:
      pattern:
        place: *traffic-light
        neverInsteadOf: *water

  # Lights

  # https://opendata.paris.fr/explore/dataset/eclairage-public/export/?disjunctive.lib_domain&disjunctive.lib_ouvrag&disjunctive.nature_voi&disjunctive.lib_voiedo&disjunctive.materiau_s&disjunctive.modele_lum&disjunctive.lib_lumi_1&disjunctive.lib_lampef&disjunctive.lib_regime&disjunctive.type_suppo&refine.lib_ouvrag=Cand%C3%A9labre&refine.lib_regi_1=STV+Centre&basemap=jawg.dark&location=16,48.86511,2.36013

  fetchLights:
    type: fetchData
    modelType: lights
    provider:
      type: shapefile
      filePath: data/eclairage-public.shp
    processor:
      type: geoToolsVector

  renderLights:
    after:
      - fetchLights
      - roads
    type: renderSurfaces
    models:
      type: lights
    heightmap: ground
    place:
      pattern:
        place: *city-light
        neverInsteadOf: *water

  # Other details

  fetchFireHydrants:
    type: fetchData
    modelType: fire_hydrants
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: fire_hydrants
    processor:
      type: geoToolsVector

  renderFireHydrants:
    after:
      - fetchFireHydrants
      - roads
    type: renderSurfaces
    models:
      type: fire_hydrants
    heightmap: ground
    place: *fire-hydrant

  fetchTrashCans:
    type: fetchData
    modelType: trash_cans
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: trash_cans
    processor:
      type: geoToolsVector

  renderTrashCans:
    after:
      - fetchTrashCans
      - roads
    type: renderSurfaces
    models:
      type: trash_cans
    place: *trash-can
    heightmap: ground

  fetchPicNic:
    type: fetchData
    modelType: picnic
    provider:
      type: gpkg
      filePath: data/osm_extract.gpkg
      typeName: picnic
    processor:
      type: geoToolsVector

  renderPicNic:
    after:
      - fetchPicNic
      - altitude
    type: renderSurfaces
    models:
      type: picnic
    heightmap: ground
    place: *pic-nic
