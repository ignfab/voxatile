heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  altitude:
    type: sequence
    do:
    - type: fetchData
      modelType: altitude
      provider:
        type: wmsFloat
        url: https://data.geopf.fr/wms-r/wms
        layer: ELEVATION.ELEVATIONGRIDCOVERAGE.SRTM3
#        layer: RGEALTI-MNT_PYR-ZIP_FXX_LAMB93_WMS
    - type: populateHeightmap
      models:
        type: altitude
      heightmap: ground
    - type: setSpawn
      heightmap:
        sum: [ground, 1]
      x: 0
      y: 0

  # Overpass fetches

  fetchOsm:
    type: fetchData
    modelType: osm
    retry: 4
    retryDelay: 5
    provider:
      type: overpass
      url: &overpass-url https://overpass.private.coffee/api/interpreter #https://overpass-api.de/api/interpreter
      query: (nwr[building];nwr[natural=water];nwr[highway];nwr[natural=tree];)
    postProcessing:
    - type: parse
      metadata: building:levels
      as: decimal
      ifMissing: ignore
      ifNotParsable: removeMetadata    
    - type: default
      metadata: building:levels
      value: 2
      as: integer
      # MISSING OPERATORS
    - type: default
      metadata: height
      value: 10
      as: integer

  flattenWater:
    after:
    - fetchOsm
    - altitude
    type: copyHeightmap
    models:
      type: osm
      filter:
        metadata: natural
        equals: water
    from:
      localMin: ground
      range: 9
    to: ground

  renderGround:
    after:
    - altitude
    - flattenWater
    type: renderHeightmap
    at: ground
    place:
      structure:
      - put: *voxel-grass
        at: [0, 0, 0]
      - put: *voxel-dirt
        at: [0, 0, -3..-1]
      - put: *voxel-stone
        at: [0, 0, -20..-4]

  renderBuildings:
    after:
    - fetchOsm
    - renderGround
    type: sequence
    models: 
      type: osm
      filter:
        hasMetadata: building
    do:
    - type: computeHeightmapStats
      heightmap: ground
      compute:
        minimum: minimum-ground-altitude
        maximum: ground-floor-altitude
    - type: fillBetweenHeightmapAndMetadata
      heightmap: ground
      altitudeMetadata: ground-floor-altitude
      placeAbove: *voxel-empty
      placeBelow: *voxel-building-ground
    - type: renderBuildings
      roof: *voxel-cobble
      wall: *voxel-stone
      window: *voxel-glass

  renderTrees:
    after:
    - fetchOsm
    - altitude
    - renderWater
    type: renderPoints2d
    models:
      type: osm
      filter:
        metadata: natural
        equals: tree
    heightmap: ground
    place:
    - pattern:
        seed: forest-tree1
        chance: 0.5
        place: *forest-tree1
    - *forest-tree2

  renderWater:
    after: fetchOsm
    using: renderGround
    type: sequence
    models:
      type: osm
      filter:
        metadata: natural
        equals: water
    do: 
    - type: copyHeightmap
      from: 1
      to: water
    - type: copyHeightmap
      from:
        remap:
          manhattan: water
          maximumDistance: 12
          targetValue: 0
        mapping:
          0: 0
          1: 1
          2: 8
          3..3: 10
          4..6: 11
          7..12: 12
      to: water
    - type: renderHeightmap
      minimum:
        sum:
          - ground
          - 1
          - product: [ -1, water ]
      maximum: ground
      place:
        structure:
          - put: *voxel-water
            at: [ 0, 0, 0 ]
          # This a dirt fix to remove vegetation on water
          - put: *voxel-air
            at: [ 0, 0, 1..12 ]

  renderRoads:
    after:
    - fetchOsm
    - renderGround
    type: sequence
    models:
      type: osm
      filter:
        hasMetadata: highway
    do:
    - type: renderLines2d
      heightmap: ground
      structure:
        at: [ 0, -3..3, 0 ]
        put: *road-paint
    - type: renderLines2d
      heightmap: ground
      structure:
        at: [ 0, -2..2, 0 ]
        put: *road-tar
