#
# This is a tool for working out facades
#
# It will work only on Minetest/Luanti for now but may be easily adapted to other games.
#
# Put your facade params to test in `&facade` anchor and launch generation.
#
# Samples of your facade, with various sizes, will be placed in resulting world.
#

# TODO-PR-Facade:
# - move that outside of processes and add area information to make it stand alone.

references:
  - &corner-material default:desert_sandstone_block
  - &base-material default:sandstone
  - &other-material default:desert_stone
  - &borders-material default:desert_sandstone_block
  - &cornice-material default:desert_sandstone_block
  - &lintel-material default:sandstonebrick
  - &materials
      "-": *base-material
      "+": *other-material
      "O": *borders-material
      "*": default:glass
      "=": *lintel-material
      "|": default:fence_junglewood
  - &facade
    - along: x
      concatenate:
        # Left corner
        - &corner
          structure:
            at: [ 0, -1..0, 0 ]
            put: *corner-material
          stretchableAlongX:
            at: 0
          stretchableAlongZ:
            at: 0
          priority: -1
        # TODO-PR-Facade
        - along: z
          concatenate:
            # Ground floor
            - priority: 1
              along: x
              concatenate:
                - atLeast: 0
                  along: x
                  repeat:
                    structure:
                      axes: [ z, x ]
                      blueprint: [ "-O==O", "-O**O", "-O**O", "-O**O", "-O==O", "-O--O" ]
                      with : *materials
                    stretchableAlongZ:
                      at: 0
                # Door
                - structure:
                    axes: [ z, x ]
                    blueprint: [ "-O==O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-" ]
                    with : *materials
                  stretchableAlongZ:
                    at: 0
                # Right ground windows
                - along: x
                  atLeast: 0
                  repeat:
                    structure:
                      axes: [ z, x ]
                      blueprint: [ "O==O-", "O**O-", "O**O-", "O**O-", "O==O-", "O--O-" ]
                      with: *materials
                    stretchableAlongZ:
                      at: 0
            # Cornice
            - structure:
                at: [ 0, 0, 0 ]
                put: *cornice-material
              stretchableAlongX:
                at: 0
            # Upper floors
            - priority: 2
              along: z
              atLeast: 0
              repeat:
                along: x
                concatenate:
                  - structure:
                      at: [ 0, 0, 0..5 ]
                      put: *other-material
                  - along: x
                    repeat:
                      structure:
                        axes: [ y, z, x ]
                        blueprint:
                          - [ "O==O+", "O**O+", "O**O+", "O**O+", "O==O+", "O--O+" ]
                          - [ "     ", "     ", "     ", "|||| ", "==== ", "O  O " ]
                        with : *materials
                        # TODO-PR-Facade: En inversant la profondeur, on peut s'éviter beaucoup d'offset (a priori, les façade vont être plus souvent saillantes)
                        yOffset: -1
            # Upper cornice
            - structure:
                at: [ 0, 0, 0 ]
                put: *cornice-material
              stretchableAlongX:
                at: 0
              stretchableAlongZ:
                at: 0
        # Right corner
        - *corner
    - structure:
        at: [ 0, 0, 0 ]
        put: *base-material
      stretchableAlongX:
        at: 0
      stretchableAlongZ:
        at: 0

forEachTile:

  renderGround:
    type: renderHeightmap
    at: 0
    place: default:stone

  renderBackground:
    type: debugLayout
    build:
      - along: x
        repeat:
          along: z
          repeat:
            structure:
              with:
                O: wool:dark_grey
                X: wool:grey
              axes: [x, z]
              blueprint: ["OX", "XO"]
    at:
      x: -100
      y: 60
      z: 1
    size:
      x: 250
      z: 100

  renderFacadeTiny:
    type: debugLayout
    build: *facade
    at:
      x: -50
      y: 50
      z: 1
    size:
      x: 8
      z: 4

  renderFacadeSmall:
    type: debugLayout
    build: *facade
    at:
      x: -40
      y: 50
      z: 1
    size:
      x: 11
      z: 9

  renderFacadeMedium:
    type: debugLayout
    build: *facade
    at:
      x: -25
      y: 50
      z: 1
    size:
      x: 20
      z: 22

  renderFacadeLarge:
    type: debugLayout
    build: *facade
    at:
      x: 0
      y: 50
      z: 1
    size:
      x: 32
      z: 30

  renderFacadeHuge:
    type: debugLayout
    build: *facade
    at:
      x: 40
      y: 50
      z: 1
    size:
      x: 52
      z: 45
