heightmaps:
  ground:
    default: 0

references:
  - &corner-material default:desert_sandstone_block
  - &base-material default:sandstone
  - &other-material default:desert_stone
  - &borders-material default:desert_sandstone_block
  - &cornice-material default:desert_sandstone_block
  - &lintel-material default:sandstonebrick
  - &materials
    with:
      "-": *base-material
      "+": *other-material
      "O": *borders-material
      "*": default:glass
      "=": *lintel-material
  - &modern-wall default:clay
  - &modern-glass default:obsidian_glass
  - &modern-materials
    with:
      "O": *modern-wall
      "*": *modern-glass
  - &facade1
    - along: x
      place:
        # Left corner
        - &corner
          at: [ 0, 0, 0 ]
          put: *corner-material
          stretchX:
            at: 0
          stretchZ:
            at: 0
          priority: -1
        - along: z
          place:
          # Ground floor
          - along: x
            priority: 1
            place:
              # Left ground windows
              - along: x
                atLeast: 0
                repeat:
                  << : *materials
                  axes: [ z, x ]
                  blueprint: [ "-O==O", "-O**O", "-O**O", "-O**O", "-O==O", "-O--O" ]
                  stretchZ:
                    at: 0
              # Door
              - << : *materials
                axes: [ z, x ]
                blueprint: [ "-O==O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-" ]
                stretchZ:
                  at: 0
              # Right ground windows
              - along: x
                atLeast: 0
                repeat:
                  << : *materials
                  axes: [ z, x ]
                  blueprint: [ "O==O-", "O**O-", "O**O-", "O**O-", "O==O-", "O--O-" ]
                  stretchZ:
                    at: 0
          # Cornice
          - at: [ 0, 0, 0 ]
            put: *cornice-material
            stretchX:
              at: 0
          # Upper floors
          - priority: 2
            along: z
            atLeast: 0
            repeat:
              along: x
              place:
                - at: [ 0, 0, 0..5 ]
                  put: *other-material
                - along: x
                  repeat:
                    << : *materials
                    axes: [ z, x ]
                    blueprint: [ "O==O+", "O**O+", "O**O+", "O**O+", "O==O+", "O--O+" ]
          # Upper cornice
          - at: [ 0, 0, 0 ]
            put: *cornice-material
            stretchX:
              at: 0
            stretchZ:
              at: 0
        # Right corner
        - *corner
    - at: [ 0, 0, 0 ]
      put: *base-material
      stretchX:
        at: 0
      stretchZ:
        at: 0
  - &facade2
    - along: x
      place:
        # Left corner
        - put: *modern-wall
          at: [0, 0, 0]
          stretchX:
            at: 0
          stretchZ:
            at: 0
        # Facade
        - priority: 1
          along: z
          place:
            # Ground floor
            - along: x
              place:
                # Left
                - along: x
                  repeat:
                    << : *modern-materials
                    axes: [z, x]
                    blueprint: [ "O**", "O**", "O**", "OOO", "OOO"]
                # Door
                - << : *modern-materials
                  axes: [z, x]
                  blueprint: [ "OOOO", "O  O", "O  O", "O  O", "O  O" ]
                # Right
                - along: x
                  repeat:
                    << : *modern-materials
                    axes: [z, x]
                    blueprint: [ "**O", "**O", "**O", "OOO", "OOO" ]
            # Upper floors
            - priority: 1
              along: x
              place:
                - put: *modern-wall
                  at: [0, 0, 0 ]
                  stretchZ:
                    at: 0
                - along: x
                  repeat:
                    << : *modern-materials
                    axes: x
                    blueprint: "**O"
                    stretchZ:
                      at: 0
            # Top
            - put: *modern-wall
              at: [0, 0, 0 ]
              stretchX:
                at: 0
              stretchZ:
                at: 0
        # Left corner
        - put: *modern-wall
          at: [0, 0, 0]
          stretchX:
            at: 0
          stretchZ:
            at: 0
    # Default
    - at: [ 0, 0, 0 ]
      put: *modern-wall
      stretchX:
        at: 0
      stretchZ:
        at: 0

forEachTile:

  renderGround:
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]

  renderFacadeTiny1:
    type: debugFacade
    build: *facade1
    at:
      x: -50
      y: 50
      z: 1
    size:
      x: 8
      y: 1
      z: 4

  renderFacadeSmall1:
    type: debugFacade
    build: *facade1
    at:
      x: -40
      y: 50
      z: 1
    size:
      x: 11
      y: 1
      z: 9

  renderFacadeMedium1:
    type: debugFacade
    build: *facade1
    at:
      x: -25
      y: 50
      z: 1
    size:
      x: 20
      y: 1
      z: 22

  renderFacadeLarge1:
    type: debugFacade
    build: *facade1
    at:
      x: 0
      y: 50
      z: 1
    size:
      x: 32
      y: 1
      z: 30

  renderFacadeHuge1:
    type: debugFacade
    build: *facade1
    at:
      x: 40
      y: 50
      z: 1
    size:
      x: 52
      y: 1
      z: 45

  renderFacadeTiny:
    type: debugFacade
    build: *facade2
    at:
      x: -50
      y: 100
      z: 1
    size:
      x: 8
      y: 1
      z: 4

  renderFacadeSmall2:
    type: debugFacade
    build: *facade2
    at:
      x: -40
      y: 100
      z: 1
    size:
      x: 11
      y: 1
      z: 9

  renderFacadeMedium2:
    type: debugFacade
    build: *facade2
    at:
      x: -25
      y: 100
      z: 1
    size:
      x: 20
      y: 1
      z: 22

  renderFacadeLarge2:
    type: debugFacade
    build: *facade2
    at:
      x: 0
      y: 100
      z: 1
    size:
      x: 32
      y: 1
      z: 30

  renderFacadeHuge2:
    type: debugFacade
    build: *facade2
    at:
      x: 40
      y: 100
      z: 1
    size:
      x: 52
      y: 1
      z: 45
