heightmaps:
  ground:
    default: 0

references:
  - &corner-material default:desert_sandstone_block
  - &base-material default:sandstone
  - &other-material default:desert_stone
  - &borders-material default:desert_sandstone_block
  - &cornice-material default:desert_sandstone_block
  - &lintel-material default:sandstonebrick
  - &materials
      "-": *base-material
      "+": *other-material
      "O": *borders-material
      "*": default:glass
      "=": *lintel-material
      "|": default:fence_junglewood
  - &modern-wall default:clay
  - &modern-glass default:obsidian_glass
  - &modern-materials
    with:
      "O": *modern-wall
      "*": *modern-glass
  - &facade
    - along: x
      concatenate:
        # Left corner
        - &corner
          at: [ 0, -1..0, 0 ]
          put: *corner-material
          stretchX:
            at: 0
          stretchZ:
            at: 0
          priority: -1
        # TODO
        - along: z
          concatenate:
            # Ground floor
            - priority: 1
              along: x
              concatenate:
                - atLeast: 0
                  along: x
                  repeat:
                    axes: [ z, x ]
                    blueprint: [ "-O==O", "-O**O", "-O**O", "-O**O", "-O==O", "-O--O" ]
                    with : *materials
                    stretchZ:
                      at: 0
                # Door
                - axes: [ z, x ]
                  blueprint: [ "-O==O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-", "-O  O-" ]
                  with : *materials
                  stretchZ:
                    at: 0
                # Right ground windows
                - along: x
                  atLeast: 0
                  repeat:
                    axes: [ z, x ]
                    blueprint: [ "O==O-", "O**O-", "O**O-", "O**O-", "O==O-", "O--O-" ]
                    with: *materials
                    stretchZ:
                      at: 0
            # Cornice
            - at: [ 0, 0, 0 ]
              put: *cornice-material
              stretchX:
                at: 0
            # Upper floors
            - priority: 2
              along: z
              atLeast: 0
              repeat:
                along: x
                concatenate:
                  - at: [ 0, 0, 0..5 ]
                    put: *other-material
                  - along: x
                    repeat:
                      axes: [ y, z, x ]
                      blueprint:
                        - [ "O==O+", "O**O+", "O**O+", "O**O+", "O==O+", "O--O+" ]
                        - [ "     ", "     ", "     ", "|||| ", "==== ", "O  O " ]
                      with : *materials
                      # TODO: En inversant la profondeur, on peut s'éviter beaucoup d'offset (a priori, les façade vont être plus souvent saillantes)
                      yOffset: -1
            # Upper cornice
            - at: [ 0, 0, 0 ]
              put: *cornice-material
              stretchX:
                at: 0
              stretchZ:
                at: 0
        # Right corner
        - *corner
    - at: [ 0, 0, 0 ]
      put: *base-material
      stretchX:
        at: 0
      stretchZ:
        at: 0

forEachTile:

  renderGround:
    type: renderHeightmap
    at: ground
    place:
      structure:
        - put: *voxel-grass
          at: [0, 0, 0]
        - put: *voxel-dirt
          at: [0, 0, -3..-1]
        - put: *voxel-stone
          at: [0, 0, -20..-4]

  renderBackground:
    type: debugFacade
    build:
      - along: x
        repeat:
          along: z
          repeat:
            with:
              O: wool:dark_grey
              X: wool:grey
            axes: [x, z]
            blueprint: ["OX", "XO"]
    at:
      x: -100
      y: 60
      z: 1
    size:
      width: 250
      height: 100

  renderFacadeTiny:
    type: debugFacade
    build: *facade
    at:
      x: -50
      y: 50
      z: 1
    size:
      width: 8
      height: 4

  renderFacadeSmall:
    type: debugFacade
    build: *facade
    at:
      x: -40
      y: 50
      z: 1
    size:
      width: 11
      height: 9

  renderFacadeMedium:
    type: debugFacade
    build: *facade
    at:
      x: -25
      y: 50
      z: 1
    size:
      width: 20
      height: 22

  renderFacadeLarge:
    type: debugFacade
    build: *facade
    at:
      x: 0
      y: 50
      z: 1
    size:
      width: 32
      height: 30

  renderFacadeHuge:
    type: debugFacade
    build: *facade
    at:
      x: 40
      y: 50
      z: 1
    size:
      width: 52
      height: 45
