crs: EPSG:6870
heightmaps:
  ground:
    default: 0
  water:
    default: 0

forEachTile:

  # ===========================================================================
  #  TERRAIN
  # ===========================================================================
  altitude:
    type: sequence
    do:
      - type: fetchData
        modelType: altitude
        provider:
          type: terrarium
          # https://mapterhorn.com/coverage/#map=8.54/41.4918/20.0628
          url: https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png
          zoom: 14
          resolution: 30
      - type: populateHeightmap
        models:
          type: altitude
        heightmap: ground
      - type: setSpawn
        heightmap:
          sum: [ground, 1]
        x: 0
        y: 0
      - type: renderHeightmap
        at: ground
        place:
          structure:
            - put: *voxel-grass
              at: [0, 0, 0]
            - put: *voxel-dirt
              at: [0, 0, -3..-1]
            - put: *voxel-stone
              at: [0, 0, -20..-4]

  # ===========================================================================
  #  LAND COVER (CORINE Land Cover 2018)
  # ===========================================================================
  # CORINE codes are remapped here, once and for all, into readable identifiers.
  # Rendering tasks then need to know neither the codes nor the Albanian name of
  # the attribute: switching data source only touches this block.
  fetchLandcover:
    after: altitude
    type: fetchData
    modelType: landcover
    provider:
      type: wmsFeatureInfo
      url: https://geoportal.asig.gov.al/service/akmjedis/wms
      layer: Mbulesa_tokes_Corine_2018
    retry: 10
    postProcessing:
      - type: remap
        metadata: KodiKlases
        toFrom:
          forest:      [ "311", "312", "313", "324" ]   # broad-leaved, coniferous, mixed, regrowth
          scrub:       [ "322", "323" ]                 # moors, sclerophyllous vegetation
          farmland:    [ "211", "212", "213", "241", "242", "243" ]
          orchard:     [ "221", "222", "223" ]          # vineyards, fruit trees, olive groves
          grassland:   [ "231", "321" ]                 # pastures, natural grassland
          urbanDense:  [ "111" ]                        # continuous urban fabric
          urbanLoose:  [ "112" ]                        # discontinuous urban fabric
          industrial:  [ "121" ]
          transport:   [ "122", "123", "124" ]          # road and rail, ports, airports
          bareGround:  [ "131", "132", "133" ]          # extraction, dump and construction sites
          urbanGreen:  [ "141", "142" ]                 # green urban areas, sport and leisure
          sand:        [ "331" ]
          rock:        [ "332", "333", "334" ]
          wetland:     [ "411", "421", "422" ]
        default: other
      - type: copy
        metadata: KodiKlases
        to: landType

  # A `schedule` gathers the fourteen renderings: the model selection is declared
  # once and inherited by the subtasks, which then only carry their own filter.
  # Other tasks only have to wait for `landcover`.
  #
  # In every `place` list the ground material comes FIRST: each item overwrites
  # what the previous ones placed, so a base listed last would wipe out every
  # pattern above it.
  landcover:
    after: fetchLandcover
    type: schedule
    models:
      type: landcover
    do:

      forest:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ forest ]
        heightmap: ground
        place:
          - *voxel-grass
          - pattern:
              seed: forest-fern
              chance: 0.12
              place:
                structure:
                  - at: [0, 0, 1]
                    put: *forest-grass
          - pattern:
              seed: forest-tree-oak
              chance: 0.02
              place:
                structure:
                  axes: [ z, y, x ]
                  blueprint:
                    - - "     "
                      - "  *  "
                      - " *** "
                      - "  *  "
                      - "     "
                    - - " *** "
                      - "*****"
                      - "*****"
                      - "*****"
                      - " *** "
                    - - " *** "
                      - "*****"
                      - "**|**"
                      - "*****"
                      - " *** "
                    - - "     "
                      - "     "
                      - "  |  "
                      - "     "
                      - "     "
                    - - "     "
                      - "     "
                      - "  |  "
                      - "     "
                      - "     "
                  with:
                    "*": *voxel-leaves
                    "|": *voxel-tree
          - pattern:
              seed: forest-tree-pine
              chance: 0.01
              place:
                structure:
                  axes: [ z, y, x ]
                  blueprint:
                    - - "     "
                      - "     "
                      - "  *  "
                      - "     "
                      - "     "
                    - - "     "
                      - "  *  "
                      - " *** "
                      - "  *  "
                      - "     "
                    - - "  *  "
                      - " *** "
                      - "**|**"
                      - " *** "
                      - "  *  "
                    - - "     "
                      - "  *  "
                      - " *|* "
                      - "  *  "
                      - "     "
                    - - "     "
                      - "     "
                      - "  |  "
                      - "     "
                      - "     "
                    - - "     "
                      - "     "
                      - "  |  "
                      - "     "
                      - "     "
                  with:
                    "*": *voxel-pine-needles
                    "|": *voxel-pine-tree

      scrub:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ scrub ]
        heightmap: ground
        place:
          - *voxel-grass
          - pattern:
              seed: scrub-grass
              chance: 0.2
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:dry_grass_3
          - pattern:
              seed: scrub-bush
              chance: 0.05
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:bush_stem
                  - at: [0, 0, 2]
                    put: default:bush_leaves

      farmland:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ farmland ]
        heightmap: ground
        place:
          - *voxel-grass
          # Two stalk heights: at a single chance of 0.3 the bare ground showed
          # through and the field read as pasture rather than crops.
          - pattern:
              seed: farmland-wheat
              chance: 0.6
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:dry_grass_5
          - pattern:
              seed: farmland-wheat-short
              chance: 0.3
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:dry_grass_4

      orchard:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ orchard ]
        heightmap: ground
        place:
          - *voxel-grass
          - pattern:
              seed: orchard-tree
              chance: 0.03
              place:
                structure:
                  axes: [ z, y, x ]
                  blueprint:
                    - - "   "
                      - " * "
                      - "   "
                    - - "***"
                      - "*|*"
                      - "***"
                    - - "   "
                      - " | "
                      - "   "
                  with:
                    "*": *voxel-leaves
                    "|": *voxel-tree

      grassland:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ grassland ]
        heightmap: ground
        place:
          - *voxel-grass
          - pattern:
              seed: grassland-tuft
              chance: 0.25
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:grass_4
          - pattern:
              seed: grassland-flower
              chance: 0.02
              place:
                structure:
                  - at: [0, 0, 1]
                    put: flowers:dandelion_yellow

      urbanDense:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ urbanDense ]
        heightmap: ground
        place:
          - default:stone_block
          - pattern:
              seed: dense-cobble
              chance: 0.3
              place: *voxel-cobble
          - pattern:
              seed: dense-brick
              chance: 0.15
              place: default:stonebrick
          - pattern:
              seed: dense-moss
              chance: 0.05
              place: default:mossycobble

      urbanLoose:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ urbanLoose ]
        heightmap: ground
        place:
          - *voxel-grass
          - pattern:
              seed: loose-lawn
              chance: 0.15
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:grass_2
          - pattern:
              seed: loose-garden-tree
              chance: 0.01
              place:
                structure:
                  axes: [ z, y, x ]
                  blueprint:
                    - - "   "
                      - " * "
                      - "   "
                    - - "***"
                      - "***"
                      - "***"
                    - - "   "
                      - "   "
                      - "   "
                  with:
                    "*": *voxel-leaves
                    "|": *voxel-tree

      industrial:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ industrial ]
        heightmap: ground
        place:
          - default:stone_block
          - pattern:
              seed: indus-gravel
              chance: 0.25
              place: default:gravel
          - pattern:
              seed: indus-metal
              chance: 0.04
              place: default:steelblock

      transport:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ transport ]
        heightmap: ground
        place:
          - default:stone_block
          - pattern:
              seed: transport-wear
              chance: 0.12
              place: *voxel-cobble

      bareGround:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ bareGround ]
        heightmap: ground
        place:
          - default:gravel
          - pattern:
              seed: bare-stone
              chance: 0.3
              place: *voxel-stone
          - pattern:
              seed: bare-dirt
              chance: 0.2
              place: *voxel-dirt
          - pattern:
              seed: bare-sand
              chance: 0.1
              place: default:silver_sand

      urbanGreen:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ urbanGreen ]
        heightmap: ground
        place:
          - *voxel-grass
          - pattern:
              seed: park-path
              chance: 0.06
              place: default:gravel
          - pattern:
              seed: park-grass
              chance: 0.2
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:grass_3
          - pattern:
              seed: park-flower
              chance: 0.03
              place:
                structure:
                  - at: [0, 0, 1]
                    put: flowers:rose
          - pattern:
              seed: park-tree
              chance: 0.015
              place:
                structure:
                  axes: [ z, y, x ]
                  blueprint:
                    - - "     "
                      - "  *  "
                      - " *** "
                      - "  *  "
                      - "     "
                    - - " *** "
                      - "*****"
                      - "**|**"
                      - "*****"
                      - " *** "
                    - - "     "
                      - "     "
                      - "  |  "
                      - "     "
                      - "     "
                  with:
                    "*": *voxel-leaves
                    "|": *voxel-tree

      sand:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ sand ]
        heightmap: ground
        place: *voxel-sand

      rock:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ rock ]
        heightmap: ground
        place: *voxel-stone

      wetland:
        type: renderSurfaces
        models:
          filter:
            metadata: landType
            in: [ wetland ]
        heightmap: ground
        place:
          - *voxel-dirt
          - pattern:
              seed: wetland-papyrus
              chance: 0.08
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:papyrus

  # ===========================================================================
  #  HYDROGRAPHY
  # ===========================================================================
  water:
    after: altitude
    type: sequence
    models:
      type: water
    do:
      - type: fetchData
        modelType: water
        provider:
          type: wmsFeatureInfo
          url: https://geoportal.asig.gov.al/service/hidro_operator/wms
          layer: iii_rrjedhe_ujore_1
        retry: 10
      # Carve the bed by lowering the ground to the local minimum.
      - type: copyHeightmap
        from:
          localMin: ground
          range: 9
        to: ground
      - type: copyHeightmap
        from: 1
        to: water
      # Depth grows with the distance from the bank.
      - type: copyHeightmap
        from:
          remap:
            manhattan: water
            maximumDistance: 12
            targetValue: 0
          mapping:
            0: 0
            1: 1
            2: 8
            3..3: 10
            4..6: 11
            7..12: 12
        to: water
      - type: renderHeightmap
        minimum:
          sum:
            - ground
            - 1
            - product: [ -1, water ]
        maximum: ground
        place:
          structure:
            - put: *voxel-water
              at: [ 0, 0, 0 ]
            # Clear the vegetation that would otherwise float on the surface.
            - put: *voxel-air
              at: [ 0, 0, 1..12 ]

  # ===========================================================================
  #  BUILDINGS
  # ===========================================================================
  buildings:
    after:
      - altitude
      - landcover
    type: sequence
    models:
      type: buildings
    do:
      - type: fetchData
        modelType: buildings
        provider:
          type: wmsFeatureInfo
          url: https://geoportal.asig.gov.al/service/adresar/wms
          layer: adr_ndertese
        retry: 10
        # The ASIG layer carries no height at all, so every building is given 10 m.
        postProcessing:
          - type: default
            metadata: height
            value: 10
            as: integer
      # Keeps a building on a slope from having one corner buried and the other
      # hanging in the air.
      - type: computeHeightmapStats
        heightmap: ground
        compute:
          minimum: minimum-ground-altitude
          maximum: ground-floor-altitude
      # Clear inside the building
      - type: renderSurfaces
        heightmap: ground
        place:
          structure:
            - put: *voxel-air
              at: [ 0, 0, 1..10 ]
      # Build fondations under the building
      - type: fillBetweenHeightmapAndMetadata
        heightmap: ground
        altitudeMetadata: ground-floor-altitude
        placeAbove: *voxel-air
        placeBelow: default:stone_block
      - type: renderBuildings
        roof: default:desert_stone_block
        wall: default:sandstonebrick
        window: *voxel-glass

  # ===========================================================================
  #  ROAD NETWORK
  # ===========================================================================
  # Same idea as the land cover: the Albanian values are remapped here into
  # stable identifiers. Switching from the WMS to the shapefile would only touch
  # this block, as the attribute is named `persimbol` in one and `PërSimbol` in
  # the other.
  fetchRoads:
    after: altitude
    type: fetchData
    modelType: roads
    provider:
      type: wmsFeatureInfo
      url: https://geoportal.asig.gov.al/service/Rrjete_Transporti/wms
      layer: rruge_asig_062025
      # The layer answers between 0.7 and 50 m per pixel; below that it returns an
      # empty collection without any error, hence resolution: 1 (scale 1:3571).
      resolution: 1
      spacing: 50
      queryRadius: 70
    retry: 10
    postProcessing:
      - type: remap
        metadata: persimbol
        toFrom:
          national:   Kombëtare
          local:      Lokale
          roundabout: Rrethrrotullim
          bridge:     Urë
          tunnel:     Tunel
          overpass:   Mbikalim
          # "Nënkalm" is a typo present in the source data (one segment)
          underpass:  [ Nënkalim, Nënkalm ]
          railway:    Hekurudhe
        default: other
      - type: copy
        metadata: persimbol
        to: roadType
      - type: remap
        metadata: kategori_1
        toFrom:
          paved:   E shtruar
          unpaved: E pashtruar
        default: other
      - type: copy
        metadata: kategori_1
        to: surface

  roads:
    after:
      - fetchRoads
      - altitude
      - landcover
      - water
    type: schedule
    models:
      type: roads
    do:

      # ---- pass 1: corridor and kerbs -------------------------------------
      # Every kerb is laid before any carriageway: this is what keeps a kerb
      # from cutting across the road it crosses.

      clearNational:
        type: renderLines2d
        models:
          filter:
            metadata: roadType
            in: [ national, roundabout, overpass ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "········"
            - "········"
            - "········"
            - "········"
            - "▒······▒"
          with:
            "·": air
            "▒": *voxel-cobble

      clearLocal:
        after: clearNational
        type: renderLines2d
        models:
          filter:
            metadata: roadType
            in: [ local, underpass ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "·····"
            - "·····"
            - "·····"
            - "▒···▒"
          with:
            "·": *voxel-air
            "▒": *voxel-cobble

      clearUnpaved:
        after: clearLocal
        type: renderLines2d
        models:
          filter:
            metadata: surface
            in: [ unpaved ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "····"
            - "····"
            - "····"
          with:
            "·": *voxel-air

      # ---- pass 2: carriageways -------------------------------------------
      # Each one starts after clearUnpaved, therefore after ALL the kerbs.
      # Narrower than the corridor, so that the kerbs remain visible
      # everywhere except at intersections.

      surfaceNational:
        after: clearUnpaved
        type: renderLines2d
        models:
          filter:
            metadata: roadType
            in: [ national, roundabout, overpass ]
        heightmap: ground
        structure:
          axes: [ y ]
          blueprint: "AAA█AAA"
          with:
            "A": default:stone_block
            "█": *road-paint

      surfaceLocal:
        after: surfaceNational
        type: renderLines2d
        models:
          filter:
            metadata: roadType
            in: [ local, underpass ]
        heightmap: ground
        structure:
          axes: [ y ]
          blueprint: "AAA"
          with:
            "A": default:stone_block

      surfaceUnpaved:
        after: surfaceLocal
        type: renderLines2d
        models:
          filter:
            metadata: surface
            in: [ unpaved ]
        heightmap: ground
        structure:
          axes: [ y ]
          blueprint: "DGGD"
          with:
            "D": *voxel-dirt
            "G": default:gravel

      surfaceRailway:
        after: surfaceUnpaved
        type: renderLines2d
        models:
          filter:
            metadata: roadType
            in: [ railway ]
        heightmap: ground
        structure:
          axes: [ y ]
          blueprint: "GWSWG"
          with:
            "G": default:gravel
            "W": default:wood
            "S": default:steelblock

      # ---- engineering structures ----------------------------------------

      bridge:
        after: surfaceRailway
        type: renderLines2d
        models:
          filter:
            metadata: roadType
            in: [ bridge ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "W      W"
            - "AAAAAAAA"
          with:
            "A": default:stone_block
            "W": *voxel-cobble

  # ===========================================================================
  #  RAILWAY
  #  A separate WMS layer, hence a separate model: it cannot join the `schedule`
  #  above, which imposes `type: roads` on its subtasks.
  # ===========================================================================
  railway:
    after:
      - landcover
      - roads
    type: sequence
    models:
      type: railways
    do:
      - type: fetchData
        modelType: railways
        provider:
          type: wmsFeatureInfo
          url: https://geoportal.asig.gov.al/service/Rrjete_Transporti/wms
          layer: linjehekurudh_asig_062025
          resolution: 1
          spacing: 50
          queryRadius: 70
        retry: 10
      - type: renderLines2d
        heightmap: ground
        structure:
          axes: [ y ]
          blueprint: "GWSWG"
          with:
            "G": default:gravel
            "W": default:wood
            "S": default:steelblock

  # ===========================================================================
  #  CHEMINS PIETONS (OSM)
  # ===========================================================================
  footway:
    after:
      - landcover
      - tree
      - roads
    type: sequence
    models:
      type: footways
    do:
      - type: fetchData
        modelType: footways
        provider:
          type: overpass
          url: https://overpass-api.de/api/interpreter
          query: nwr[highway=footway]
        retry: 10
      - type: renderLines2d
        heightmap: ground
        structure:
          axes: [ y ]
          blueprint: "SS"
          with:
            "S": default:sandstone

  # ===========================================================================
  #  MURS, CLOTURES ET PORTAILS (OSM)
  fetchBarriers:
    after: altitude
    type: fetchData
    modelType: barriers
    provider:
      type: overpass
      url: https://overpass-api.de/api/interpreter
      query: nwr[barrier]
    retry: 10
    postProcessing:
      - type: remap
        metadata: barrier
        toFrom:
          cityWall:  city_wall
          wall:      [ wall, retaining_wall ]
          fence:     [ fence, cable_barrier, handrail, "yes" ]
          hedge:     hedge
          guardRail: [ guard_rail, jersey_barrier ]
          kerb:      [ kerb, chain, cycle_barrier ]
          gate:      [ gate, sliding_gate, swing_gate, lift_gate, toll_booth, border_control ]
          bollard:   [ bollard, block ]
        default: other
      - type: copy
        metadata: barrier
        to: barrierType

  barriers:
    after:
      - landcover
      - fetchBarriers
      - roads
      - footway
    type: schedule
    models:
      type: barriers
    do:

      cityWall:
        type: renderLines2d
        models:
          filter:
            metadata: barrierType
            in: [ cityWall ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "MMM"
            - "M M"
            - "M M"
            - "M M"
            - "M M"
            - "MMM"
          with:
            "M": default:stonebrick

      wall:
        type: renderLines2d
        models:
          filter:
            metadata: barrierType
            in: [ wall ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "C"
            - "C"
            - "C"
          with:
            "C": default:cobble

      fence:
        type: renderLines2d
        models:
          filter:
            metadata: barrierType
            in: [ fence ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "F"
            - "F"
          with:
            "F": default:fence_wood

      hedge:
        type: renderLines2d
        models:
          filter:
            metadata: barrierType
            in: [ hedge ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "L"
            - "L"
          with:
            "L": default:bush_leaves

      guardRail:
        type: renderLines2d
        models:
          filter:
            metadata: barrierType
            in: [ guardRail ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "S"
          with:
            "S": default:steelblock

      kerb:
        type: renderLines2d
        models:
          filter:
            metadata: barrierType
            in: [ kerb ]
        heightmap: ground
        structure:
          axes: [ z, y ]
          blueprint:
            - "K"
          with:
            "K": default:stone_block

      gate:
        type: renderPoints2d
        models:
          filter:
            metadata: barrierType
            in: [ gate ]
        heightmap: ground
        place:
          structure:
            axes: [ z, y, x ]
            blueprint:
              - - "PFP"
              - - "PFP"
            with:
              "P": default:stonebrick
              "F": default:fence_wood

      bollard:
        type: renderPoints2d
        models:
          filter:
            metadata: barrierType
            in: [ bollard ]
        heightmap: ground
        place:
          structure:
            - at: [0, 0, 1]
              put: default:stone_block

  # ===========================================================================
  #  ARBRES ISOLES (OSM)
  #  Places avant la voirie, pour que le nettoyage final puisse les degager
  #  des chaussees.
  # ===========================================================================
  tree:
    after:
      - altitude
      - landcover
    type: sequence
    models:
      type: trees
    do:
      - type: fetchData
        modelType: trees
        provider:
          type: overpass
          url: https://overpass-api.de/api/interpreter
          query: nwr[natural=tree]
        retry: 10
      - type: renderPoints2d
        heightmap: ground
        place:
          structure:
            axes: [ z, y, x ]
            blueprint:
              - - "     "
                - "  *  "
                - " *** "
                - "  *  "
                - "     "
              - - "     "
                - " *** "
                - " *** "
                - " *** "
                - "     "
              - - " *** "
                - "*****"
                - "*****"
                - "*****"
                - " *** "
              - - " *** "
                - "*****"
                - "**|**"
                - "*****"
                - " *** "
              - - "     "
                - "     "
                - "  |  "
                - "     "
                - "     "
              - - "     "
                - "     "
                - "  |  "
                - "     "
                - "     "
              - - "     "
                - "     "
                - "  |  "
                - "     "
                - "     "
            with:
              "*": default:leaves
              "|": default:tree

  # ===========================================================================
  #  SURFACES OSM (parkings, cimetieres)
  # ===========================================================================
  parking:
    after:
      - altitude
      - landcover
    type: sequence
    models:
      type: parking
    do:
      - type: fetchData
        modelType: parking
        provider:
          type: overpass
          url: https://overpass-api.de/api/interpreter
          query: nwr[amenity=parking]
        retry: 10
      - type: renderSurfaces
        heightmap: ground
        place:
          - default:stone_block
          - pattern:
              seed: parking-wear
              chance: 0.08
              place: default:gravel

  cemetery:
    after:
      - altitude
      - landcover
    type: sequence
    models:
      type: cemetery
    do:
      - type: fetchData
        modelType: cemetery
        provider:
          type: overpass
          url: https://overpass-api.de/api/interpreter
          query: nwr[landuse=cemetery]
        retry: 10
      - type: renderSurfaces
        heightmap: ground
        place:
          - default:dirt_with_grass
          - pattern:
              seed: cemetery-path
              chance: 0.06
              place: default:gravel
          - pattern:
              seed: cemetery-grave
              chance: 0.05
              place:
                structure:
                  - at: [0, 0, 1]
                    put: default:stonebrick
