references:
  - &facade
    - yAlignZ:
      - along: z
        atLeast: 1
        repeat:
          along: z
          atLeast: 10
          atMost: 10
          repeat:
            at: [ 0, -1..1, 0 ]
            put: wool:red
  - &facade2
    - yAlignZ:
        - along: z
          atLeast: 10
          repeat:
            at: [ 0, -1..1, 0 ]
            put: wool:red


forEachTile:

  renderGround:
    type: renderHeightmap
    at: 0
    place: default:stone

  renderFacadeLarge:
    type: debugLayout
    build: *facade
    at:
      x: 0
      y: 50
      z: 1
    size:
      x: 12
      y: 3
      z: 15
