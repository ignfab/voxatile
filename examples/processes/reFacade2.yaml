#
# This is a tool for working out facades
#
# It will work only on Minetest/Luanti for now but may be easily adapted to other games.
#
# Put your facade params to test in `&facade` anchor and launch generation.
#
# Samples of your facade, with various sizes, will be placed in resulting world.
#

# TODO:
# - move that outside of processes and add area information to make it stand alone.

references:
  - &corner-material default:desert_sandstone_block
  - &base-material default:sandstone
  - &other-material default:desert_stone
  - &borders-material default:desert_sandstone_block
  - &cornice-material default:desert_sandstone_block
  - &lintel-material default:sandstonebrick
  - &materials
      "-": *base-material
      "+": *other-material
      "O": *borders-material
      "*": default:glass
      "=": *lintel-material
      "|": default:fence_junglewood
  - &facade
    - xAlign:
        # Left corner
        - along: z
          atLeast: 10
          repeat:
            atLeast: 3
            along: x
            repeat:
              at: [ 0, -1..1, 0 ]
              put: wool:red
          priority: -1
        # Right corner
        - along: z
          atLeast: 4
          repeat:
            atLeast: 2
            along: x
            repeat:
              at: [ 0, 0, 0 ]
              put: wool:green
          priority: -1
    - at: [ 0, 0, 0 ]
      put: *base-material
      stretchX:
        at: 0
      stretchZ:
        at: 0

forEachTile:

  renderGround:
    type: renderHeightmap
    at: 0
    place: default:stone

  renderFacadeLarge:
    type: debugLayout
    build: *facade
    at:
      x: 0
      y: 50
      z: 1
    size:
      x: 32
      z: 30
