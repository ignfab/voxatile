#      Industriel: MAGENTA
#      Religieux: LIGHT_BLUE
#      Résidentiel: RED
#      Sportif: ORANGE
#    defaultRoof: WHITE
  road-dirt-path:
    after:
      - source:road
      - renderer:ground
    type: road
    modelType: road
    classifications:
      - Chemin
      - Escalier
      - Sentier
    heightmap: ground
    voxel: PATH
  road-stone-path:
    after:
      - source:road
      - renderer:ground
    type: road
    modelType: road
    classifications:
      - Route empierrée
    heightmap: ground
    voxel: COBBLE
  road-concrete:
    after:
      - source:road
      - renderer:ground
      - renderer:road-dirt-path
      - renderer:road-stone-path
    type: road
    modelType: road
    classifications:
      - Bretelle
      - Rond-point
      - Route à 1 chaussée
      - Route à 2 chaussées
      - Type autoroutier
    heightmap: ground
    large: true
    voxel: CONCRETE
  vegetation:
    after:
      - source:lidarhd
    type: classified
    modelType: lidarhd
    voxels:
      3: VEGETATION
      4: VEGETATION
      5: VEGETATION
  bati-lidar-roofs:
    after:
      - source:lidarhd
    type: classified
    modelType: lidarhd
    voxels:
      6: BRICK
  # TODO lidar terrestre + path
verticalScale: 1.0
horizontalScale: 1.0
area:
  center:
    # Mairie
    latitude: 50.457398
    longitude: 2.792343
    # Terrils
    #latitude: 50.44558
    #longitude: 2.78259
  extendX: 500
  extendY: 500
crs: EPSG:2154
format: minetest
