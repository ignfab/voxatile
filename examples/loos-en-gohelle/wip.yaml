  road:
    modelType: road
    provider:
      type: wfs
      url: https://data.geopf.fr/wfs/wfs
      features: BDTOPO_V3:troncon_de_route
    processor:
      type: geoToolsVector
    postProcessors:
      - type: copy
        metadata: nature
        to: classification
  lidarhd:
    modelType: lidarhd
    provider:
      type: lasTiled
      tilesPath: data/LIDARHD
      tilesFilenameTemplate: copc_Semis_2023_%04d_%04d_LA93_IGN69.laz
      tileSize: 1000
      tileOffsetY: 1000
      crs: EPSG:2154
    processor:
      type: lasPoints
