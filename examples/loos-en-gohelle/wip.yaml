renderers:
  altitude:
    after:
      - source:mnt
    type: heightmap
    modelType: mnt
    heightmap: ground
  ground:
    after:
      - renderer:altitude
    type: ground
    heightmap: ground
    voxels:
      GRASS: 1
      DIRT: 3
      STONE: 10
#  ground:
#    after:
#      - source:ortho
#      - renderer:altitude
#    type: groundColored
#    modelType: ortho
#    heightmap: ground
